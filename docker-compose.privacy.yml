# Privacy-mode deployment manifest for the Open Privacy Suite.
#
# This is the authoritative deployment for corporate / permissioned chains.
# It deliberately omits every component that could bypass Open Privacy Suite.
# If a service is missing here, that is on purpose — not oversight.
#
# See deployments/privacy/README.md for the trust-boundary rationale
# (RD-855).
#
# Quick start:
#   docker compose -f docker-compose.privacy.yml --env-file .env.privacy up -d
#
# All services pull published images from Docker Hub / GHCR — no
# local build required. Pin per-service via env vars (recommended in
# production); defaults to `latest`:
#
#   PROXY_VERSION    — gatewayfm/privacy-proxy-{backend,frontend} (Docker Hub)
#   EXPLORER_VERSION — gatewayfm/block-explorer-{api,frontend}    (Docker Hub)
#   INDEXER_VERSION  — ghcr.io/gateway-fm/chain-indexer
#
# `latest` is acceptable only for default smoke-tests. Production
# deployments SHOULD pin to a tagged release.
#
# For developers iterating on local source changes against the privacy
# architecture, use docker-compose.privacy.dev.yml — it's a sibling
# (not an overlay) with its own `build:` blocks honouring
# CHAIN_INDEXER_PATH and BLOCK_EXPLORER_PATH for sibling-clone iteration.
#
# Note on block-explorer-api: this manifest pulls
# gatewayfm/block-explorer-api-privacy, NOT gatewayfm/block-explorer-api.
# The block-explorer release workflow publishes both as separate images
# (block-explorer PR #66, RD-922) — the privacy variant has the
# chain-indexer gRPC client compiled out via the `privacy` build tag.
# Two-image split removes the dependency on Dockerfile stage order;
# image name is the load-bearing identity. Defense-in-depth still
# applies: INDEXER_URL is intentionally unset AND block-explorer-api
# has no docker-network route to indexer-zone, so even a regression
# to the standalone binary cannot reach chain-indexer from here.

services:
  # ----- Trust zone --------------------------------------------------------
  # Only Open Privacy Suite sits on both networks. Nothing else in the trust
  # zone is reachable from the public network.

  privacy-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PRIVACY_POSTGRES_PASSWORD:?PRIVACY_POSTGRES_PASSWORD is required in privacy mode}
      - POSTGRES_DB=privacy_proxy
    volumes:
      - privacy-postgres-data:/var/lib/postgresql/data
    networks:
      - indexer-zone
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d privacy_proxy"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required in privacy mode}
    networks:
      - indexer-zone
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required in privacy mode}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  anvil:
    # Development EVM node. In production, swap to an external RPC endpoint
    # and remove this service entirely — Open Privacy Suite already reaches it
    # via NODE_URL.
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--steps-tracing", "--block-time", "2"]
    networks:
      - indexer-zone
    healthcheck:
      test: ["CMD-SHELL", "cast block-number --rpc-url http://localhost:8545 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Chain-indexer owns its own postgres. Neither is reachable from the
  # public network — there is no path for a client to query the indexer
  # directly. Open Privacy Suite is the sole consumer.
  indexer-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${INDEXER_POSTGRES_PASSWORD:?INDEXER_POSTGRES_PASSWORD is required in privacy mode}
      - POSTGRES_DB=chain_indexer
    volumes:
      - indexer-postgres-data:/var/lib/postgresql/data
    networks:
      - indexer-zone
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chain_indexer"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chain-indexer:
    # Production manifest: pull the image from GHCR. Pin a tagged
    # release via INDEXER_VERSION (e.g. v1.2.3); defaults to `latest`.
    # The dev compose (docker-compose.privacy.dev.yml) overrides this
    # back to `build:` from a sibling clone (CHAIN_INDEXER_PATH).
    image: ghcr.io/gateway-fm/chain-indexer:${INDEXER_VERSION:-latest}
    environment:
      - RPC_URL=http://anvil:8545
      - DATABASE_URL=postgres://postgres:${INDEXER_POSTGRES_PASSWORD:?INDEXER_POSTGRES_PASSWORD is required in privacy mode}@indexer-postgres:5432/chain_indexer?sslmode=disable
      - GRPC_LISTEN_ADDR=:50051
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - POLL_INTERVAL=2s
      - ENABLE_TRACING=true
      - ENABLE_OP_DEPOSITS=${ENABLE_OP_DEPOSITS:-false}
    depends_on:
      indexer-postgres:
        condition: service_healthy
      anvil:
        condition: service_healthy
    networks:
      - indexer-zone
    restart: unless-stopped

  proxy-backend:
    # Production-intent manifest: pulls the published `prod`-target image
    # from Docker Hub. The release workflow (.github/workflows/release.yml)
    # builds with target: prod (no `mockauth` build tag), so
    # MOCK_SIGNATURES / ALLOW_MOCK_LOGIN are not even linked into the
    # binary. For local source iteration use docker-compose.privacy.dev.yml
    # (sibling compose) which builds with target: dev.
    image: gatewayfm/privacy-proxy-backend:${PROXY_VERSION:-latest}
    # Open Privacy Suite is the only external-facing backend in privacy mode.
    # In production this would typically sit behind an ingress instead
    # of publishing directly; for local dev + the negative-network test
    # it's published to 127.0.0.1 only by default. Operators on a LAN
    # who want devices on the same network to reach the stack
    # (e.g. mobile Privado wallet) can set HOST_BIND=0.0.0.0.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT_PROXY:-8080}:8080"
    environment:
      # Run the process in UTC. Plain TIMESTAMP columns store wall-clock
      # components, so a non-UTC process tz would skew RBAC expiry checks
      # (RD-1005). The DB session is pinned to UTC in code as well.
      - TZ=UTC
      - NODE_URL=http://anvil:8545
      - DATABASE_URL=postgres://postgres:${PRIVACY_POSTGRES_PASSWORD:?PRIVACY_POSTGRES_PASSWORD is required in privacy mode}@privacy-postgres:5432/privacy_proxy?sslmode=disable
      - PORT=8080
      # ENVIRONMENT acts as a binary kill switch in code: anything
      # other than the literal string "production" unlocks dev
      # shortcuts (localhost in OAuth redirect-URI allowlist,
      # MOCK_SIGNATURES, ALLOW_MOCK_LOGIN, demo auto-auth — see
      # internal/config/config.go:215-240). The privacy compose is the
      # production-intent manifest; this MUST be "production". The dev
      # compose explicitly sets "development".
      - ENVIRONMENT=production
      - VERIFIER_ID=${VERIFIER_ID:-did:privado:verifier:dev-0000000000000000}
      - BASE_URL=${BASE_URL:-http://localhost:${HOST_PORT_PROXY:-8080}}
      # Browser-facing URL of the Open Privacy Suite admin UI. When set, the
      # OAuth /authorize endpoint redirects browser requests to the React
      # login page at FRONTEND_URL/login?oauth_session=… instead of
      # serving backend-rendered fallback HTML. Operators should override
      # for production deployments (e.g. https://proxy.yourdomain.com).
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:${HOST_PORT_UI:-5173}}
      # OAuth redirect-URI allowlist (comma-separated explicit origins).
      # BASE_URL's origin is auto-allowed; add anything else — e.g. the
      # block-explorer-frontend on a different port, or a LAN IP for
      # mobile testing — here. "*" does NOT allow arbitrary redirects;
      # only explicit origins do (see internal/server/oauth.go's
      # isValidRedirectURI).
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required in privacy mode}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required in privacy mode}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required in privacy mode (bootstrap admin credential)}
      - CROSS_ORG_AUTHORIZATION_ORACLE_MODE=${CROSS_ORG_AUTHORIZATION_ORACLE_MODE:-disabled}
      - CROSS_ORG_AUTHORIZATION_ORACLE_TOKEN=${CROSS_ORG_AUTHORIZATION_ORACLE_TOKEN:-}
      - CROSS_ORG_AUTHORIZATION_ORACLE_ORG_IDS=${CROSS_ORG_AUTHORIZATION_ORACLE_ORG_IDS:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required in privacy mode}@redis:6379
      - ENABLE_TRAVEL_RULE=true
      - EXTRA_RPC_NAMESPACES_FILE=${EXTRA_RPC_NAMESPACES_FILE:-}  # Path to JSON file with chain-specific RPC methods (opt-in; empty = skip)
      - OAUTH_FIRST_PARTY_CLIENTS=${OAUTH_FIRST_PARTY_CLIENTS:-}  # RD-993 + RD-1006: <client_id>:<bcrypt_hash>,... — see .env.production.example
      # Org-admin volume/timing audit view of user↔user txs (value preserved,
      # addresses stay [PRIVATE], reveals audit-logged). Default off = strict privacy.
      - ORG_ADMIN_VIEW_USER_TXS=${ORG_ADMIN_VIEW_USER_TXS:-false}
      - PRIVACY_READ_PROFILE=${PRIVACY_READ_PROFILE:-}
      # Indexer integration — this is what flips Open Privacy Suite's explorer
      # backend from direct SQL to gRPC. The explorer postgres variable is
      # still accepted for standalone fallback (ABI writes, indexer
      # progress) per RD-855 behavioral-shifts doc, but in a pure privacy
      # deployment it points at the same indexer postgres read-only.
      - INDEXER_URL=chain-indexer:50051
      - EXPLORER_DATABASE_URL=postgres://postgres:${INDEXER_POSTGRES_PASSWORD:?INDEXER_POSTGRES_PASSWORD is required in privacy mode}@indexer-postgres:5432/chain_indexer?sslmode=disable
    volumes:
      - ./rpc-namespaces.json:/app/config/rpc-namespaces.json:ro
    depends_on:
      privacy-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chain-indexer:
        condition: service_started
    networks:
      # proxy-backend is the sole legitimate bridge — it attaches to
      # both internal zones plus public. The static manifest test
      # enforces by name that no other service may be on both
      # indexer-zone and bff-zone.
      - indexer-zone
      - bff-zone
      - public
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ----- Public zone -------------------------------------------------------
  # Only user-facing SPAs live here. No backend, no database, no indexer.

  proxy-frontend:
    image: gatewayfm/privacy-proxy-frontend:${PROXY_VERSION:-latest}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT_UI:-5173}:80"
    environment:
      - VITE_API_TARGET=http://proxy-backend:8080
      # Browser-facing block-explorer URL the RBAC "View as" button navigates
      # to. Must be reachable from the operator's browser (host port), NOT an
      # internal service name. Written into /config.js at container start
      # (runtime config), so it is a deploy-time setting — not baked at build.
      - VITE_BLOCK_EXPLORER_URL=${VITE_BLOCK_EXPLORER_URL:-http://localhost:${HOST_PORT_EXPLORER:-3001}}
    depends_on:
      proxy-backend:
        condition: service_started
    networks:
      - public
    restart: unless-stopped

  # Block-explorer runs as frontend + a thin Backend-for-Frontend (BFF)
  # api. The BFF owns browser sessions (OAuth code flow against
  # Open Privacy Suite, HttpOnly cookies, contract verification) and proxies
  # chain-data reads to Open Privacy Suite's REST explorer surface, which
  # applies RBAC-based redaction.
  #
  # The BFF image is built with --target privacy, which compiles out the
  # chain-indexer gRPC client (Go build tag "privacy"). Even with env
  # vars flipped at runtime, the binary has no code path to reach
  # chain-indexer — the only data source it can talk to is
  # Open Privacy Suite. This is the compile-time layer of the three-layer
  # defense (compile-time + runtime + network) documented in
  # docs/rd-855-behavioral-shifts.md.

  block-explorer-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${BLOCK_EXPLORER_POSTGRES_PASSWORD:?BLOCK_EXPLORER_POSTGRES_PASSWORD is required in privacy mode}
      - POSTGRES_DB=explorer
    volumes:
      - block-explorer-postgres-data:/var/lib/postgresql/data
    networks:
      - bff-zone
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d explorer"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  block-explorer-api:
    # Privacy-build BFF — explicitly the `-privacy` image (compiled with
    # `-tags privacy`, indexerclient package excluded). See header
    # comment for the two-image rationale. The sibling dev compose
    # (docker-compose.privacy.dev.yml) has its own build: block
    # honouring BLOCK_EXPLORER_PATH for local-source iteration.
    image: gatewayfm/block-explorer-api-privacy:${EXPLORER_VERSION:-latest}
    environment:
      - DATABASE_URL=postgres://postgres:${BLOCK_EXPLORER_POSTGRES_PASSWORD:?BLOCK_EXPLORER_POSTGRES_PASSWORD is required in privacy mode}@block-explorer-postgres:5432/explorer?sslmode=disable
      - RPC_URL=http://proxy-backend:8080
      - API_PORT=8080
      # Privacy-build: INDEXER_URL is intentionally unset. The privacy
      # binary rejects it at startup anyway, but leaving it off here is
      # defense in depth against a compose-merge accident.
      - PRIVACY_PROXY_URL=http://proxy-backend:8080
      - PRIVACY_PROXY_PUBLIC_URL=${PRIVACY_PROXY_PUBLIC_URL:-http://localhost:${HOST_PORT_PROXY:-8080}}
      # W-1: REQUIRED in privacy mode — the BFF fails closed at startup if unset.
      # NO default on purpose: the operator must supply the exact trusted browser
      # origins (HTTPS). A localhost/wildcard default would be an insecure prod
      # footgun. Mirror of the proxy-backend CORS_ALLOWED_ORIGINS above.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # A-3: auth cookies are forced Secure in privacy mode (correct for an HTTPS
      # prod deploy). Deliberately NOT setting COOKIE_SECURE here — the dev
      # compose sets it false ONLY because that stack is plain HTTP.
      - SSO_CLIENT_ID=${SSO_CLIENT_ID:-explorer}
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET:-}
      - SSO_REDIRECT_URI=${SSO_REDIRECT_URI:-http://localhost:${HOST_PORT_EXPLORER:-3001}/api/auth/callback}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      block-explorer-postgres:
        condition: service_healthy
      proxy-backend:
        condition: service_started
    networks:
      # bff-zone only — the BFF holds no chain data and has no route
      # to indexer-zone. Even if a future change drops the
      # `--target privacy` build tag or sets INDEXER_URL, the BFF
      # cannot reach chain-indexer because they're on different docker
      # networks. The block-explorer-frontend nginx and proxy-backend
      # (the bridge) are the only legitimate callers.
      - bff-zone
    restart: unless-stopped

  # Block-explorer frontend — SPA served by nginx. The mounted nginx
  # config routes:
  #   /api/auth/*   -> block-explorer-api (OAuth flow, cookie set)
  #   /api/*        -> block-explorer-api (which forwards to Open Privacy Suite)
  #   /ws           -> 404 (subscriptions not supported in privacy mode)
  block-explorer-frontend:
    # Published nginx + SPA bundle. The bind-mount below replaces the
    # in-image standalone-mode default.conf with the privacy-mode one,
    # routing /api/* to block-explorer-api (which forwards to
    # Open Privacy Suite with RBAC redaction). Same path inside the image
    # as the standalone variant — no build-target distinction here.
    image: gatewayfm/block-explorer-frontend:${EXPLORER_VERSION:-latest}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT_EXPLORER:-3001}:80"
    environment:
      # Tells the SPA we're in privacy mode. The block-explorer entrypoint.sh
      # writes every VITE_* env var into /config.js as window.__runtimeConfig,
      # which lib/features.ts reads at runtime to compile the contract-
      # verification surface out of the UI (block-explorer rc1 #5). The BFF
      # also strips the matching backend routes via the `privacy` Go build
      # tag, so the gate is enforced both client and server side.
      - VITE_PRIVACY_MODE=true
    volumes:
      - ./deployments/privacy/nginx.privacy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      block-explorer-api:
        condition: service_started
    networks:
      - public
      # Frontend's nginx also attaches to bff-zone so it can reach
      # block-explorer-api. It does NOT attach to indexer-zone — there
      # is no path for the SPA host to reach the indexer.
      - bff-zone
    restart: unless-stopped

  # Expose Open Privacy Suite on the host too, so clients hitting
  # localhost:${HOST_PORT_PROXY} work for testing.
  #
  # In production deployments the reverse proxy / ingress is the only
  # host-exposed surface, so you'd drop the port publish block on
  # proxy-backend and publish only the ingress.

networks:
  # Indexer zone — services that handle raw chain data, plus
  # Open Privacy Suite's own state (postgres, redis). Open Privacy Suite
  # (proxy-backend) is the only legitimate caller. The block-explorer
  # BFF is NOT attached here; even if a future change drops the BFF's
  # `--target privacy` build tag or sets INDEXER_URL, the BFF still
  # cannot reach the indexer because it has no route to this network.
  indexer-zone:
    driver: bridge
    internal: false   # proxy-backend needs NODE_URL egress when the EVM
                     # node lives outside compose; flip to true in prod
                     # if the node is also on this network.

  # BFF zone — block-explorer-api (the BFF) and its verification
  # postgres. The BFF talks to its own postgres locally and to
  # Open Privacy Suite via this same network (proxy-backend is the bridge).
  # Holds no chain data.
  bff-zone:
    driver: bridge
    internal: false

  # Public zone — SPAs + the proxy-backend's exposed port. No direct
  # access to any data source.
  public:
    driver: bridge

volumes:
  privacy-postgres-data:
  indexer-postgres-data:
  block-explorer-postgres-data:
