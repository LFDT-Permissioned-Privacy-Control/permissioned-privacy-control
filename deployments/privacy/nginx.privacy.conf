# Block-explorer frontend nginx config for PRIVACY MODE only.
#
# RD-855 deployment shape: block-explorer in privacy mode has a thin
# Backend-for-Frontend (block-explorer-api, built with the "privacy"
# Go tag so the chain-indexer client is compiled out entirely). The
# BFF owns browser sessions — OAuth code flow against Open Privacy Suite,
# HttpOnly cookies, contract verification — and proxies chain-data
# reads to Open Privacy Suite, which applies RBAC-based redaction.
#
# Routes:
#   /api/*   -> block-explorer-api (the BFF). Auth handlers and
#               chain-data handlers both live here; chain-data
#               handlers internally forward to Open Privacy Suite.
#   /ws      -> 404 (WebSocket subscriptions deferred; see RD-855)
#   /        -> static SPA (client-side routing via try_files fallback)
#
# Standalone mode uses a different config that routes /api/* and /ws to
# the local block-explorer api service. That config lives in the
# block-explorer repo and is the default for that project's own
# docker-compose.yml. This privacy-mode file REPLACES it at runtime via a
# bind mount from Open Privacy Suite's docker-compose.privacy.yml.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # All API calls go to block-explorer-api, the BFF. It handles the
  # OAuth flow against Open Privacy Suite, sets HttpOnly session cookies,
  # and forwards chain-data reads to Open Privacy Suite's explorer REST
  # API so redaction is applied before data reaches the browser.
  #
  # In this compose, block-explorer-api is reachable only on the
  # trust-zone network at block-explorer-api:8080; the frontend
  # container is on both networks.
  location /api/ {
    proxy_pass http://block-explorer-api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Rate limits are applied by Open Privacy Suite per viewer; don't
    # double-up here.
    proxy_read_timeout 60s;
  }

  # WebSocket streaming is deferred in privacy mode. RD-855 rejects
  # filter-based WS leaks and no replacement is wired yet. Return 404 so
  # SPA code that accidentally attempts to open a subscription fails fast
  # instead of silently hanging.
  location = /ws {
    return 404;
  }

  # Runtime config (non-static) — never cache.
  location = /config.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Static assets — fingerprinted; cache aggressively.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback. index.html is never cached so a new build is picked
  # up immediately.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
