version: 2
updates:
  # Version updates are batched into one PR per ecosystem per month. Security
  # fixes do not wait for this schedule: they arrive through the Aikido triage
  # and govulncheck in CI, which fails as soon as an advisory affects a pinned
  # version. The Besu and Reth approval integrations, with their Java/Rust
  # dependency updates and advisory audit, live in gateway-fm/ops-node-integrations.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      go-dependencies:
        patterns:
          - "*"
