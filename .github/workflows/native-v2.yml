name: Native V2

on:
  pull_request: {}
  push:
    branches: [main, master, release/2.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.11'
  NODE_VERSION: '24.22.1'
  GOMAXPROCS: '2'
  OPS_TEST_BROWSER_CHANNEL: chromium

jobs:
  native-controls:
    name: Native commands, identity and browser controls
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Select credential-free local Docker access
        run: node scripts/v2-demo/docker-env.mjs --github-env
      - name: Install locked browser and test-wallet dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix e2e/playwright
          npm ci --prefix tools/v2-test-wallet --ignore-scripts
          ./e2e/playwright/node_modules/.bin/playwright install --with-deps chromium
          docker pull postgres:16-alpine
      - name: Provision and verify pinned public circuits
        run: node scripts/v2-test-prerequisites.mjs
      - name: Fetch exact sources and build the indexer-owned gRPC fixture
        run: |
          node scripts/v2-ci-dependencies.mjs
          INDEXER_SOURCE=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".tmp/v2-ci-dependencies/selection.json")).dependencies.indexer.directory)')
          mkdir -p .tmp/v2-indexer-fixture
          go -C "$INDEXER_SOURCE" build -o "$PWD/.tmp/v2-indexer-fixture/server" ./internal/contractfixture
          echo "OPS_TEST_INDEXER_SOURCE=$INDEXER_SOURCE" >> "$GITHUB_ENV"
          echo "OPS_TEST_INDEXED_READ_SERVER=$PWD/.tmp/v2-indexer-fixture/server" >> "$GITHUB_ENV"
      - name: Test required-case enforcement and demo authentication boundary
        run: |
          node --test scripts/test-v2-runner.test.mjs scripts/v2-demo/ownership.test.mjs scripts/v2-demo/export-config.test.mjs tools/v2-demo-wallet/*.test.mjs
          CGO_ENABLED=0 go test -p 1 -tags production,prover_disabled ./internal/operational/v2demo ./cmd/ops-v2-demo-init
      - name: Check canonical disclosure expiry after a real SQL roundtrip
        run: CGO_ENABLED=0 go test -p 1 -tags production,prover_disabled ./internal/disclosurepolicy ./internal/operational/disclosuresql -run '^(TestProtectedUntilCanonicalUTC|TestCaseTimestampRoundTripUTC)$' -count=1 -timeout=90s
      - name: Test native commands and architecture
        run: node scripts/test-v2.mjs core
      - name: Test actual gRPC Explorer privacy, disclosure and Recorder paths
        run: node scripts/test-v2.mjs indexer
      - name: Build native delivery
        run: make build-v2
      - name: Test native browser units
        working-directory: frontend
        run: npx --no-install vitest run --config vitest.v2.config.ts
      - name: Test real role proofs and fresh renewal
        run: node scripts/test-v2.mjs identity
      - name: Test built central login and browser session isolation
        run: node scripts/test-v2.mjs browser
      - name: Upload finite control results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-v2-controls
          path: .tmp/v2-test-results/
          if-no-files-found: error
          retention-days: 7

  native-walkthrough:
    name: Native chain and Explorer walkthrough
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPS_V2_DEMO_PROJECT: ops-v2-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Select credential-free local Docker access
        run: node scripts/v2-demo/docker-env.mjs --github-env
      - name: Fetch exact Explorer and indexer sources
        run: node scripts/v2-ci-dependencies.mjs
      - name: Install the locked walkthrough browser
        run: |
          npm ci --prefix e2e/playwright
          ./e2e/playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Run actual chain and Explorer acceptance
        run: make demo-v2-check
      - name: Stop only this walkthrough
        if: always()
        run: make demo-v2-down
