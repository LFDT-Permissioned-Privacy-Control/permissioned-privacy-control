name: Dev Image (mock-auth)

# Manually-triggered build + push of the DEV / mock-auth image pair to Docker Hub.
#
# ⚠️  SECURITY — these are NOT production images.
# The backend is built with the `mockauth` build tag and the frontend with
# VITE_ALLOW_MOCK_LOGIN=true. Together they enable MOCK LOGIN (wallet / ZK
# signature verification skipped) whenever ALLOW_MOCK_LOGIN=true and
# ENVIRONMENT != production at runtime. They exist ONLY for testing / acceptance
# stacks and MUST NEVER be deployed to production.
#
# To make that unmistakable and hard to misuse, this workflow:
#   * is manual-only (workflow_dispatch) — nothing triggers it automatically;
#   * requires an explicit confirmation input before it will run;
#   * publishes ONLY `dev-*`-prefixed tags — never `latest`, never a bare
#     semver (prod pins exact semver tags, so a prod deploy can't pull these);
#   * stamps the in-binary version with a `dev-mockauth-` prefix (visible at
#     /api/v1/admin/system/version);
#   * labels the images "NOT FOR PRODUCTION" (OCI + a dev.mock-auth=true label).
#
# Runtime reminder: the pulled backend still needs ALLOW_MOCK_LOGIN=true and
# ENVIRONMENT != production to actually accept mock logins — the image only makes
# that possible; the mockauth code is compiled out of the prod image entirely.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Confirm you are building a MOCK-AUTH dev image (never deploy to production)"
        type: choice
        required: true
        default: "no"
        options:
          - "no"
          - "yes-build-mock-auth-dev-image"
      tag:
        description: "Optional tag name; a `dev-` prefix is always added (default: dev-<short-sha>)"
        type: string
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prep:
    name: Confirm intent + resolve tag
    # The dependent jobs publish to Gateway's Docker Hub repositories.
    if: ${{ github.repository == 'gateway-fm/open-privacy-suite' }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      build_time: ${{ steps.meta.outputs.build_time }}
    steps:
      - name: Require explicit confirmation
        if: ${{ inputs.confirm != 'yes-build-mock-auth-dev-image' }}
        run: |
          echo "::error::Set the 'confirm' input to 'yes-build-mock-auth-dev-image' to build a mock-auth dev image. These images must never reach production."
          exit 1

      - name: Resolve dev tag + build metadata
        id: meta
        env:
          # Passed via env (not inlined into the script) to avoid shell injection.
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::8}"
          name="${TAG_INPUT:-$short_sha}"
          name="${name#dev-}"                             # avoid a doubled dev- prefix
          name="$(printf '%s' "$name" | tr -cd 'a-zA-Z0-9._-')"  # sanitize
          [ -z "$name" ] && name="$short_sha"
          name="${name:0:124}"                            # Docker tag max length is 128 incl. "dev-"
          {
            echo "tag=dev-${name}"
            echo "short_sha=${short_sha}"
            echo "version=dev-mockauth-${GITHUB_REF_NAME}-${short_sha}"
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

  dev-backend:
    name: Dev Backend Image (mock-auth)
    needs: prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Aikido: this job never pushes, so the checkout token is not needed.
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push dev backend image (mockauth)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.backend
          target: dev
          push: true
          # Both arches, exactly like release.yml — prod ships amd64 + arm64,
          # so the dev images match.
          platforms: linux/amd64,linux/arm64
          tags: gatewayfm/privacy-proxy-backend:${{ needs.prep.outputs.tag }}
          labels: |
            org.opencontainers.image.title=privacy-proxy-backend (DEV / mock-auth — NOT FOR PRODUCTION)
            org.opencontainers.image.description=DEV build (mockauth tag) — enables mock login when ALLOW_MOCK_LOGIN=true and ENVIRONMENT!=production. Do NOT deploy to production.
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            dev.mock-auth=true
          build-args: |
            VERSION=${{ needs.prep.outputs.version }}
            GIT_COMMIT=${{ needs.prep.outputs.short_sha }}
            BUILD_TIME=${{ needs.prep.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 🧪 Dev backend image pushed"
            echo ""
            echo "\`gatewayfm/privacy-proxy-backend:${{ needs.prep.outputs.tag }}\`"
            echo ""
            echo "**mock-auth build — NOT for production.** Run with \`ALLOW_MOCK_LOGIN=true\` and \`ENVIRONMENT=development\` to accept mock logins."
          } >> "$GITHUB_STEP_SUMMARY"

  dev-frontend:
    name: Dev Frontend Image (mock-login)
    needs: prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Aikido: this job never pushes, so the checkout token is not needed.
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push dev frontend image (mock login enabled)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend/
          file: frontend/Dockerfile
          target: prod
          push: true
          # Both arches, exactly like release.yml — prod ships amd64 + arm64,
          # so the dev images match.
          platforms: linux/amd64,linux/arm64
          tags: gatewayfm/privacy-proxy-frontend:${{ needs.prep.outputs.tag }}
          labels: |
            org.opencontainers.image.title=privacy-proxy-frontend (DEV / mock-login — NOT FOR PRODUCTION)
            org.opencontainers.image.description=DEV build with VITE_ALLOW_MOCK_LOGIN=true — renders the mock-login UI. Do NOT deploy to production.
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            dev.mock-auth=true
          build-args: |
            VITE_ALLOW_MOCK_LOGIN=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 🧪 Dev frontend image pushed"
            echo ""
            echo "\`gatewayfm/privacy-proxy-frontend:${{ needs.prep.outputs.tag }}\`"
            echo ""
            echo "**mock-login build — NOT for production.** Pair it with the dev backend image above."
          } >> "$GITHUB_STEP_SUMMARY"
