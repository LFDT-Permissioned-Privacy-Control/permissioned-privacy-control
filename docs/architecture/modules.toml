# Module map of Open Privacy Suite (RD-1367).
#
# Every source file in [scope] belongs to exactly one module. A module's tier
# says whether it is part of the security perimeter:
#
#   core     a bug can leak data or grant access in a Reth-mode (V2)
#            deployment; this is the audit perimeter
#   legacy   security-critical only in the legacy or V1 signed-approval
#            modes, which a Reth-mode deployment never selects
#   outside  never linked into a shipped binary (clients, tooling, demos);
#            reaches the system only through its network API
#
# internal/archtest enforces the boundaries (see security-perimeter.md) and
# `make perimeter-report` regenerates perimeter-report.md from this file.
#
# This file is a security control: moving a file out of the core tier
# changes what an audit covers. Changes need a security review.

[scope]
include = [
  "internal/**/*.go",
  "cmd/**/*.go",
  "gen/**/*.go",
  "mcp/**/*.go",
  "internal/db/migrations/*.sql",
  "internal/db/migrations_audit/*.sql",
  "node/reth/src/**/*.rs",
  "node-approvals/reth/src/**/*.rs",
  "node-approvals/besu/src/main/**/*.java",
  "contracts/src/**/*.sol",
  "contracts/script/**/*.sol",
  "demo/contracts/**/*.sol",
  "frontend/src/**/*.{ts,tsx}",
  "sdk/src/**/*.ts",
]
exclude = [
  "**/*_test.go",
  "**/testdata/**",
  "frontend/src/**/__tests__/**",
  "frontend/src/**/*.test.{ts,tsx}",
  "frontend/src/test/**",
]

# Non-source files that change what ships or how the rules judge it. A delta
# audit reviews changes to them (`perimeter-report -since`).
[audit_inputs]
paths = [
  "go.mod",
  "go.sum",
  "mcp/go.mod",
  "mcp/go.sum",
  "node/reth/Cargo.toml",
  "node/reth/Cargo.lock",
  "node-approvals/reth/Cargo.toml",
  "node-approvals/reth/Cargo.lock",
  "node-approvals/besu/build.gradle",
  "node-approvals/compatibility.json",
  "node/reth/scripts/prepare.py",
  "Dockerfile.backend",
  "proto/**",
  "buf.gen.yaml",
  "internal/server/apispec/swagger.*",
  ".github/workflows/**",
  "internal/archmap/**",
  "internal/archtest/**",
  "Caddyfile",
  "docker-compose*.yml",
  "frontend/nginx*.conf",
]

