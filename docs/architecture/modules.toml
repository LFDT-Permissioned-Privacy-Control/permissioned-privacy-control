# ---------------------------------------------------------------------------
# Dispatch points
# ---------------------------------------------------------------------------

# The only perimeter functions that may name legacy-mode code, each limited to
# the legacy objects it lists, with the condition that keeps the legacy path
# out of a Reth-mode deployment.

[[dispatch]]
file = "internal/server/jsonrpc_processor.go"
function = "JSONRPCProcessor.legacyRawTransaction"
objects = ["JSONRPCProcessor.processRawTransaction"]
reason = "Sends the transaction to the node path instead when node policy is enabled."

[[dispatch]]
file = "internal/server/server.go"
function = "newNodeApprovals"
objects = ["Service", "Service.Close", "preflightLimiter", "nodeApprovalsFromEnv", "newApprovalPreflightLimiter", "registerNodeApprovalMetrics"]
reason = "Returns before calling any V1 constructor when OPS_NODE_POLICY_MODE=reth."

[[dispatch]]
file = "internal/server/server.go"
function = "NewWithVerifier"
objects = ["Service", "preflightLimiter"]
reason = "Passes on what newNodeApprovals returns, which is nil in Reth mode."

[[dispatch]]
file = "internal/server/jsonrpc_processor.go"
function = "NewJSONRPCProcessor"
objects = ["Service", "preflightLimiter"]
reason = "Stores the optional V1 approval service and preflight limiter it is given; both are nil in Reth mode."

[[dispatch]]
file = "internal/server/server.go"
function = "Server.Stop"
objects = ["Service.Close"]
reason = "Closes V1 approval delivery only if it was built, which it never is in Reth mode."

[[dispatch]]
file = "internal/server/server.go"
function = "Server.mountCrossOrgOracle"
objects = ["Server.crossOrgAuthorizationOracleLimit", "Server.handlePolicyCheck"]
reason = "Mounts the oracle behind crossOrgAuthorizationOracleAuthMiddleware, which answers 404 unless the oracle is enabled; configuration validation refuses enabling it with OPS_NODE_POLICY_MODE=reth."
