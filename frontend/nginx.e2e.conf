server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://proxy-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy JSON-RPC requests to backend
    location /rpc {
        proxy_pass http://proxy-backend:8080;
        proxy_set_header Host $host;
    }

    # Proxy Privado wallet callback to backend (not Azure callback - that's SPA)
    location = /auth/callback {
        proxy_pass http://proxy-backend:8080;
        proxy_set_header Host $host;
    }

    # Proxy auth request/verify endpoints to backend
    location /auth/request {
        proxy_pass http://proxy-backend:8080;
        proxy_set_header Host $host;
    }

    location /auth/verify {
        proxy_pass http://proxy-backend:8080;
        proxy_set_header Host $host;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://proxy-backend:8080;
        proxy_set_header Host $host;
    }

    # SPA fallback: all unknown paths render index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for fingerprinted assets (Vite hashes filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry point
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
