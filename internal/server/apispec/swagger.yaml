  /api/v1/admin/cross-org-authorization-oracle:
    post:
      description: 'Cross-organization privacy-policy oracle for an explicitly trusted
        infrastructure caller. Disabled by default (CROSS_ORG_AUTHORIZATION_ORACLE_MODE=disabled),
        in which case it answers 404. Subject is a DID or Ethereum address. Operation
        is a JSON-RPC method and params. The answer is decision=allow, deny or indeterminate.
        deny means policy was evaluated inside the oracle scope (the organizations
        in CROSS_ORG_AUTHORIZATION_ORACLE_ORG_IDS) and refuses the call. indeterminate
        means the oracle cannot judge: reason=outside_oracle_scope when the subject,
        the requested or resolved organization, the target or a nested call is outside
        that scope; reason=not_simulated when the method executes EVM code the oracle
        does not trace, including a targeted eth_createAccessList, which live RPC
        keeps on its entry-point check without a trace. The oracle never consults
        an organization outside the scope. Callers should proceed on allow, block
        on deny, and on indeterminate not block on the oracle but let the live call
        decide. Authority scope: the token holder may query any member of any allowlisted
        organization; the operator allowlist is the consent boundary. In verdict_only
        mode the response carries only the decision and its coarse reason. In full_simulation
        mode an allow also carries artifacts, the raw, unredacted trace and logs of
        the simulated call, by design; where the operator must not be able to access
        tenant data, use verdict_only. Per-organization consent is planned as follow-up
        work. EVM execution methods use debug_traceCall with the same upstream credential
        as live calls. Write methods also run a side-effect-free compliance preview.
        The endpoint does not submit the call or consume a travel-rule record. A supplied
        sender must link to the subject. Requests share one global concurrency cap
        (MAX_CONCURRENT_REQUESTS in flight); request-rate limits belong to the upstream
        RPC proxy. Traces use the subject organization''s upstream API key, or the
        default key, so they count against that key''s upstream quota; an upstream
        429 is returned as 429 with its Retry-After. debug_traceCall and debug_traceTransaction
        are not supported (400). Admin, operator, and JWT credentials are not accepted.
        Every request that reaches evaluation writes one operator-only entry (no organization)
        to the hash-chained RBAC audit log, including a 429 or 503 after evaluation
        started; if that write fails the answer is withheld (500). Early 400s (malformed
        body, subject or method) and the concurrency-cap 429 are not audited. Operational
        failures (concurrency cap, upstream 429, trace errors or timeouts) return
        429 or 503, never a policy verdict.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_server.policyCheckRequest'
        description: subject, operation, and optional org_id
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/internal_server.policyCheckResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid body, missing, over-long or unsupported operation.method,
            an invalid subject address, or subject has neither/both of did and address
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid X-Cross-Org-Authorization-Oracle-Token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: the oracle is disabled (CROSS_ORG_AUTHORIZATION_ORACLE_MODE=disabled)
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: global concurrency cap reached, or upstream 429 (Retry-After
            passed through); operational, not a policy verdict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: internal error (includes audit-log write failure, response
            withheld)
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: policy simulation unavailable (upstream trace failure); operational,
            not a policy verdict
      security:
      - CrossOrgOracleToken: []
      summary: Check whether a subject would be allowed to make an RPC call
      tags:
      - 'Admin: RBAC'
