  /api/v1/admin/orgs/{org_id}/memberships/by-did:
    delete:
      description: 'Removes a user identified by DID from a group in the path org
        (the symmetric counterpart of onboard-by-did). Body: did (required), group_id
        (required). Requires full (is_org_admin) scope over the path org; the target
        group must belong to that org (opaque 403 otherwise). Removing from an is_org_admin
        group is rejected for a tier-2 org-admin JWT (an admin-tier token — full admin
        or operator — is required); removing from a regular group is rejected for
        the operator token (tenant management is the org admin''s job). A DID that
        is unknown, or has no membership in the target group, returns the SAME opaque
        403 as a foreign-org group — no existence oracle. No tenant read is performed.'
      parameters:
      - description: Organization ID (UUID)
        in: path
        name: org_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.MembershipByDIDRemovalRequest'
                description: removal request
                summary: request
        description: removal request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIMessage'
          description: membership deleted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid body
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, path org outside
            the caller's full-admin scope, target group not in the path org / DID
            not found / no membership (all opaque), tier-2 JWT removing from an org-admin
            group, or operator token removing from a regular group
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Remove a DID from a group
      tags:
      - 'Admin: RBAC'
    post:
      description: 'Onboards a user identified by DID directly into a group in the
        path org, auto-provisioning the user if the DID is not yet known. Body: did
        (required, a syntactically valid W3C DID; iden3/Polygon-ID DIDs are checksum-verified),
        group_id (required), expires_at (optional RFC3339, future). Requires full
        (is_org_admin) scope over the path org; the target group must belong to that
        org (opaque 403 otherwise). Onboarding into an is_org_admin group is rejected
        for a tier-2 org-admin JWT (an admin-tier token — full admin or operator —
        is required); onboarding into a regular group is rejected for the operator
        token (tenant management is the org admin''s job). Ban state is never revealed
        via this endpoint. ADD semantics — a new user is not also placed in the default
        group.'
      parameters:
      - description: Organization ID (UUID)
        in: path
        name: org_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.MembershipByDIDRequest'
                description: onboarding request
                summary: request
        description: onboarding request
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.MembershipByDIDResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid body, invalid DID, or expires_at (must be RFC3339 and
            in the future)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, path org outside
            the caller's full-admin scope, target group not in the path org (opaque),
            tier-2 JWT onboarding into an org-admin group, or operator token onboarding
            into a regular group
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: user is already a member of this group
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Onboard a DID into a group
      tags:
      - 'Admin: RBAC'
