components:
  schemas:
    data:
      properties:
        data:
          items:
            $ref: '#/components/schemas/privacy-proxy_internal_explorer.AddressStats'
          type: array
      type: object
    iden3comm.AttachData:
      properties:
        json: {}
      type: object
    iden3comm.Attachment:
      properties:
        data:
          $ref: '#/components/schemas/iden3comm.AttachData'
        description:
          type: string
        format:
          type: string
        id:
          type: string
        media_type:
          type: string
      type: object
    internal_server.policyCheckArtifacts:
      description: 'Artifacts appear only on allow in full_simulation mode: the raw,
        unredacted trace and logs.'
      properties:
        logs:
          items: {}
          type: array
          uniqueItems: false
        trace: {}
      type: object
    internal_server.policyCheckRPCBlock:
      properties:
        method:
          type: string
        params:
          items: {}
          type: array
          uniqueItems: false
      required:
      - method
      type: object
    internal_server.policyCheckRequest:
      properties:
        operation:
          $ref: '#/components/schemas/internal_server.policyCheckRPCBlock'
        org_id:
          description: OrgID is optional; omitted, CheckAccess resolves it as a live
            request would.
          type: string
        subject:
          $ref: '#/components/schemas/internal_server.policyCheckSubject'
      required:
      - operation
      - subject
      type: object
    internal_server.policyCheckResponse:
      properties:
        artifacts:
          $ref: '#/components/schemas/internal_server.policyCheckArtifacts'
        decision:
          enum:
          - allow
          - deny
          - indeterminate
          type: string
        reason:
          description: Reason is set on deny (denied) and indeterminate (outside_oracle_scope,
            not_simulated).
          enum:
          - denied
          - outside_oracle_scope
          - not_simulated
          type: string
      type: object
    internal_server.policyCheckSubject:
      oneOf:
      - properties:
          did:
            type: string
        required:
        - did
        type: object
      - properties:
          address:
            type: string
        required:
        - address
        type: object
    math_big.Int:
      type: object
    privacy-proxy_internal_apimodels.APIError:
      properties:
        error:
          example: invalid request
          type: string
      type: object
    privacy-proxy_internal_apimodels.APIMessage:
      properties:
        message:
          example: operation completed
          type: string
      type: object
    privacy-proxy_internal_apimodels.AddressTransactionsResponse:
      properties:
        next_cursor:
          type: string
        transactions:
          items:
            $ref: '#/components/schemas/privacy-proxy_internal_explorer.Transaction'
          type: array
          uniqueItems: false
      type: object
    privacy-proxy_internal_apimodels.AddressTransfersResponse:
      properties:
