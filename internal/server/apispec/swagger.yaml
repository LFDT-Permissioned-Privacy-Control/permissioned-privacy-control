  /api/v1/auth/request:
    post:
      description: Step 1 of the Privado ID wallet login. Creates a pending session
        and returns a session ID plus the authorization request the frontend renders
        as a QR code for the wallet to scan. The optional body may carry the browser's
        window.location.origin so the wallet callback URL is reachable from the caller's
        hostname. Rate-limited.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
