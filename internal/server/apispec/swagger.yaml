  /api/v1/admin/test-request:
    post:
      description: |-
        Dashboard diagnostic: runs one method through RBAC, the same nested-call trace as /rpc (eth_call, eth_estimateGas, and eth_createAccessList without `to`), travel-rule compliance, and upstream forwarding, using a synthetic identity ("test:dashboard") or the subject of a supplied jwt_token. Under the strict read privacy profile (PRIVACY_READ_PROFILE=strict) transaction, receipt, log and block reads are refused with 403 before anything is forwarded. On an upstream JSON-RPC-level error the call still returns HTTP 200 with the error in the response body. Requires the private-network source gate (403 otherwise).
        Client state/block override options follow the RPC policy for every caller, including admins.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.TestRequestInput'
                description: method, params, and optional jwt_token / org_id
                summary: request
        description: method, params, and optional jwt_token / org_id
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.TestRequestResponse'
          description: forwarded result (or an upstream JSON-RPC error message) plus
            latency
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid request body, invalid JWT, or a trace method (debug_traceCall
            / debug_traceTransaction are not supported here; send them to /rpc or
            /rpc/{org_id}); an invalid call shape refused by the nested-call trace
            returns a TestRequestResponse
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.TestRequestResponse'
          description: RBAC, nested-call trace or compliance denied, or a transaction,
            receipt, log or block read under the strict read profile (network-gate
            rejections return the generic error envelope)
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.TestRequestResponse'
          description: access-check or trace-validation error
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.TestRequestResponse'
          description: failed to reach the upstream node
      security:
      - AdminToken: []
      summary: Test a JSON-RPC request
      tags:
      - 'Admin: ops'
  /api/v1/admin/users:
    get:
      description: 'Returns a paginated list of RBAC users, each with a scoped summary
        of their group memberships. Results are scoped to the caller: a super-admin
        sees all users, a tier-2 org-admin JWT sees only users in the orgs it administers
        (full or read-only), and cardinality cannot be used as a cross-org enumeration
        oracle. The per-user group summary is bounded by the caller''s administered
        orgs, and when org_id is supplied it is further narrowed to that org, so the
        summary never lists a user''s memberships in other orgs. Optional filters:
        org_id, search, one or more group_id, and role. Tenant-confidential: rejected
        for the operator token (403).'
      parameters:
      - description: Restrict to users in this organization
        in: query
        name: org_id
        schema:
          type: string
      - description: Case-insensitive filter on user identifier
        in: query
        name: search
        schema:
          type: string
      - description: Restrict to members of these group IDs (repeatable)
        in: query
        name: group_id
        schema:
          items:
            type: string
          type: array
      - description: Filter by role
        in: query
        name: role
        schema:
          enum:
          - org_admin
          - admin
          - member
          type: string
      - description: Max rows to return (default 50)
        in: query
        name: limit
        schema:
          type: integer
      - description: Rows to skip for pagination (default 0)
        in: query
        name: offset
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.UserListResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid role filter
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, or operator token
            (tenant data not readable)
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: List users
      tags:
      - 'Admin: RBAC'
