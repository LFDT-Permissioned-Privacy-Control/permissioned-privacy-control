      tags:
      - Auth
  /api/v1/auth/session/{id}/status:
    get:
      description: 'The frontend polls this after showing the QR code to learn whether
        the wallet has completed authentication. While pending it returns `completed:false`;
        once complete it returns the issued tokens (and mirrors the access JWT into
        an HttpOnly cookie). If the wallet''s proof was rejected it returns `failed:true`
        with a `reason`, so the caller can surface the failure immediately instead
        of polling until it times out. `reason` is one of `verification_failed`, `humanity_required`,
        `invalid_request`, `network_not_supported`, or `authentication_failed`; sensitive
        and unrecognised failures collapse to `authentication_failed`, and the value
        never carries internal error detail. `network_not_supported` means this deployment
        has no state resolver for the wallet''s identity network — retrying cannot
        help, and the operator needs to configure that network (the supported set
        is published by `GET /api/v1/auth/providers`); the code itself names no network.
        A rejection is not final: a wallet that retries successfully still completes
        the session, so callers should keep polling while presenting the failure.
        Deliberately not rate-limited: it is read-only polling during the login flow.'
      parameters:
      - description: auth session ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.SessionStatusResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: session ID required
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: session not found or expired
      summary: Poll a Privado ID auth session for completion
      tags:
      - Auth
