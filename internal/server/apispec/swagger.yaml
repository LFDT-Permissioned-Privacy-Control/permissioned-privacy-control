      tags:
      - 'Admin: RBAC'
    put:
      description: Updates a user's kyc, banned, note, and/or metadata fields. All
        body fields are optional; only supplied fields change. Requires full (is_org_admin)
        scope over an org the user belongs to — read-only admins are rejected. Banning
        a user also revokes their refresh tokens for immediate session termination;
        because of that, a tier-2 org-admin JWT cannot set banned=true on its own
        account (400) — that would be an immediate self-lockout recoverable only with
        the full admin token. Un-banning yourself is not blocked. Out-of-scope or
        unknown users return an opaque 403.
      parameters:
      - description: User ID (UUID)
        in: path
        name: user_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.RBACUserUpdateRequest'
                description: fields to update (all optional)
                summary: request
        description: fields to update (all optional)
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_rbac.User'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid request body, or an attempt to ban your own account
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, or user outside
            the caller's full-admin scope (opaque; also covers not-found)
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Update a user
      tags:
      - 'Admin: RBAC'
