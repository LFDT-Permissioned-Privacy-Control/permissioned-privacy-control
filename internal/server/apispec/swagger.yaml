tags:
- description: 'Session authentication: Privado ID wallet flow, Azure AD (interactive
    and service principal), token refresh/revoke/introspection.'
  name: Auth
- description: OAuth 2.0 endpoints the proxy exposes as an identity provider (used
    by the block explorer for SSO).
  name: OAuth SSO
- description: 'The proxied Ethereum JSON-RPC endpoint: method allowlist, RBAC, response
    redaction. Also mounted at POST /.'
  name: JSON-RPC
- description: Linking Ethereum addresses to the authenticated DID by signature challenge.
  name: ETH linking
- description: The authenticated user's own profile.
  name: Profile
- description: Disclosure requests and grants, from the data owner's side.
  name: Disclosure (user)
- description: Privacy-filtered chain data for the block explorer backend (private
    network only).
  name: Explorer
- description: Organizations, groups, users, memberships, contracts, and grants.
  name: 'Admin: RBAC'
- description: Administering disclosure requests.
  name: 'Admin: disclosure'
- description: Travel-rule compliance configuration, sanctions lists, and token prices.
  name: 'Admin: compliance'
- description: 'Read-only "view as user" mirror: the explorer and JSON-RPC surfaces
    re-mounted under /api/v1/admin/impersonate/{target_did}/in/{org_id}/..., GET-only,
    tier-2 admin gated, per-request audited. The mirrored operations are documented
    once, under their canonical /api/v1/explorer and /rpc paths. The JSON-RPC mirror
    serves only the dry-run read methods and the org-free metadata methods (any other
    method in the body returns 400), and answers the dry-run read methods as the dry-run
    does.'
  name: 'Admin: impersonation'
- description: Fleet-level shared contract infrastructure and Azure tenant administration.
  name: 'Admin: shared infrastructure'
- description: Fleet-level system toggles and build identity.
  name: 'Admin: system'
- description: 'Operational admin endpoints: access logs, status, and test requests.'
  name: 'Admin: ops'
- description: Health, metrics, and this specification.
  name: System
