  /api/v1/admin/disclosure/check-access:
    get:
      description: 'Reports whether the requester DID currently holds an active, non-expired
        disclosure grant over the target user''s data. Used by the block explorer
        to authorize a viewer. Fail-closed: when no active grant exists the response
        is 200 with has_access=false (not an error), and when a grant exists the response
        includes the grant ID, scope, disclosure level, and expiry so the caller can
        enforce it.'
      parameters:
      - description: DID of the viewer whose access is being checked
        in: query
        name: requester_did
        required: true
        schema:
          type: string
      - description: DID of the user whose data would be viewed
        in: query
        name: target_user_did
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.DisclosureCheckAccessResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: requester_did and target_user_did are required
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Check disclosure access for a DID pair
      tags:
      - 'Admin: disclosure'
  /api/v1/admin/disclosure/grants:
    get:
      description: Lists disclosure grants (approved requests with an access token),
        filtered and clamped to the caller's org scope so a caller only sees grants
        for orgs they administer. When org_id is omitted it falls back to the caller's
        single admin org (super-admin/dev defaults to the system org); a multi-org
        JWT admin must supply org_id. Grant token hashes are never included in the
        response.
      parameters:
      - description: Organization to list grants for; required for multi-org JWT admins
        in: query
        name: org_id
        schema:
          type: string
      - description: Filter by grant status
        in: query
        name: status
        schema:
          enum:
          - approved
          - revoked
          - expired
          type: string
      - description: Filter by the user whose data is targeted
        in: query
        name: target_user_id
        schema:
          type: string
      - description: Filter by the requester DID
        in: query
        name: requester_did
        schema:
          type: string
      - description: Filter by disclosure level
        in: query
        name: disclosure_level
        schema:
          enum:
          - full
          - pseudonymous
          - redacted
          type: string
      - description: Only grants created on or after this RFC3339 timestamp
        in: query
        name: date_from
        schema:
          type: string
      - description: Only grants created on or before this RFC3339 timestamp
        in: query
        name: date_to
        schema:
          type: string
      - description: Maximum number of results
        in: query
        name: limit
        schema:
          type: integer
      - description: Number of results to skip
        in: query
        name: offset
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_disclosure.GrantListResult'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: org_id required (ambiguous multi-org caller)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, or org_id outside
            the caller's scope
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: List disclosure grants
      tags:
      - 'Admin: disclosure'
  /api/v1/admin/disclosure/grants/{grant_id}/events:
    get:
      description: Returns the disclosure access audit trail for a grant — each event
        records when the grant's data was viewed, by whom, and what resource was accessed.
        The requester must remain an active member of the request organization. Non-full
        grants omit viewer IPs and address-bearing summaries; this read is also recorded.
        Requires a valid grant token (X-Disclosure-Token header or token query parameter)
        that must belong to the grant named in the path — a token for a different
        grant is rejected (403).
      parameters:
      - description: Disclosure grant ID
        in: path
        name: grant_id
        required: true
        schema:
          type: string
      - description: Grant access token (or pass as the token query parameter)
        in: header
        name: X-Disclosure-Token
        schema:
          type: string
      - description: Grant access token (alternative to the X-Disclosure-Token header)
        in: query
        name: token
        schema:
          type: string
      - description: Max rows to return (1-1000)
        in: query
        name: limit
        schema:
          default: 100
          type: integer
      - description: Rows to skip (pagination)
        in: query
        name: offset
        schema:
          default: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/privacy-proxy_internal_disclosure.Event'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token, or invalid/absent disclosure
            token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, or token does not
            match the grant
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: grant unavailable to the current requester or organization
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Get access events for a grant
      tags:
      - 'Admin: disclosure'
  /api/v1/admin/disclosure/grants/{grant_id}/logs:
    get:
      description: Returns the target user's RPC activity log entries authorized by
        a disclosure grant. Requires a valid grant token (X-Disclosure-Token header
        or token query parameter) that must belong to the grant named in the path
        — a token for a different grant is rejected (403). The requester must remain
        an active member of the request organization. Requires activity_logs or full_disclosure;
        address-filtered activity is denied because activity records cannot establish
        that filter. Results honor the scope date range. Non-full grants omit IP addresses.
        Each read is recorded as a disclosure event.
      parameters:
      - description: Disclosure grant ID
        in: path
        name: grant_id
        required: true
        schema:
          type: string
