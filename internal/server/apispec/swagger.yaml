  /api/v1/admin/orgs/{org_id}/groups/batch-delete:
    post:
      description: 'Deletes multiple groups (and their dependencies) in a single atomic
        transaction; if any group fails a check the whole batch rolls back. Body:
        group_ids ([]string, required, max 200). Every group must belong to the path
        org. A tier-2 org-admin JWT batch that includes any is_org_admin group is
        rejected (an admin-tier token — full admin or operator — is required); the
        operator token is rejected if the batch includes any regular group (tenant
        management is the org admin''s job) — an all-admin-tier batch is accepted.
        Note this path''s gates are not identical to the per-group ones: the global
        default group counts as regular here (unlike single delete), and is_system
        groups are accepted (unlike single delete, which refuses them for every caller).'
      parameters:
      - description: Organization ID (UUID)
        in: path
        name: org_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.GroupBatchDeleteRequest'
                description: group IDs to delete
                summary: request
        description: group IDs to delete
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.GroupBatchDeleteResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid body, empty group_ids, more than 200 IDs, or one or
            more groups not in the organization
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, org outside the
            caller's scope, tier-2 JWT batch including an org-admin group, or operator
            token batch including a regular group
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Batch-delete groups
      tags:
      - 'Admin: RBAC'
