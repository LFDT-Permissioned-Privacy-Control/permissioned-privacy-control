    privacy-proxy_internal_apimodels.ExecutionPolicyCompiler:
      description: Compiler is the exact build the artifact was produced with.
      properties:
        evm_version:
          description: EVMVersion is the target the artifact was built for.
          example: shanghai
          type: string
        optimizer_runs:
          description: OptimizerRuns is the optimiser setting used.
          example: 200
          type: integer
        version:
          description: Version is the exact compiler, which is pinned rather than
            ranged.
          example: 0.8.35+commit.47b9dedd
          type: string
      type: object
    privacy-proxy_internal_apimodels.ExecutionPolicyContext:
      properties:
        active:
          $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ExecutionPolicyRevision'
        api_version:
          type: string
        base_revision:
          description: |-
            BaseRevision is the active revision a candidate must declare. Creating
            another draft does not move this base. A stale base is refused.
          example: 3
          type: integer
        contracts:
          description: Contracts are the organisation's registered contracts.
          items:
            $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ExecutionPolicyContract'
          type: array
          uniqueItems: false
        groups:
          description: |-
            Groups are the regular groups a policy may bind. Administrator groups are
            omitted: they are a trust root, not ordinary policy.
          items:
            type: string
          type: array
          uniqueItems: false
        kind:
          type: string
        nested_calls:
          type: string
        org_id:
          type: string
      type: object
    privacy-proxy_internal_apimodels.ExecutionPolicyContract:
      properties:
        abi_digest:
          description: ABIDigest is what a rule on this contract must pin.
          type: string
        address:
          type: string
        has_abi:
          description: |-
            HasABI is false when no ABI is registered. Such a contract cannot carry a
            rule, because nothing says what its selectors and arguments mean.
          type: boolean
        name:
          type: string
      type: object
    privacy-proxy_internal_apimodels.ExecutionPolicyRevision:
      description: Active is the policy currently in force, if any.
      properties:
        activated_at:
          type: string
        activated_by:
          type: string
        base_revision:
          description: |-
            BaseRevision identifies the active policy used to author this draft.
            Null means legacy provenance is unavailable and activation is refused.
          type: integer
        compiler:
          $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ExecutionPolicyCompiler'
        created_at:
          type: string
        created_by:
          type: string
        id:
          type: string
        policy_digest:
          description: |-
            PolicyDigest identifies the approved document by its meaning, not by its
            bytes: it is taken over the normalised policy, so two documents that
            differ only in whitespace or key order share one digest. Hashing the
            `source` field directly will not reproduce it.
          type: string
        revision:
          description: Revision is the monotonic number within the organisation.
          example: 3
          type: integer
        runtime_digest:
          description: RuntimeDigest identifies the compiled bytecode that is enforced.
          type: string
        solidity_digest:
          description: SolidityDigest identifies the generated contract source.
          type: string
        status:
          description: |-
            Status is draft, active, superseded or withdrawn. Only one revision per
            organisation is active, and only an active one decides anything.
          example: active
          type: string
      type: object
    privacy-proxy_internal_apimodels.ExecutionPolicyRevisionDetail:
      properties:
        activated_at:
          type: string
        activated_by:
          type: string
        base_revision:
          description: |-
            BaseRevision identifies the active policy used to author this draft.
            Null means legacy provenance is unavailable and activation is refused.
          type: integer
        compiler:
          $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ExecutionPolicyCompiler'
        created_at:
          type: string
        created_by:
          type: string
        id:
          type: string
        policy_digest:
          description: |-
            PolicyDigest identifies the approved document by its meaning, not by its
            bytes: it is taken over the normalised policy, so two documents that
            differ only in whitespace or key order share one digest. Hashing the
            `source` field directly will not reproduce it.
          type: string
        revision:
          description: Revision is the monotonic number within the organisation.
          example: 3
          type: integer
        runtime_bytecode:
          description: RuntimeBytecode is the compiled code, 0x-prefixed hex.
          type: string
        runtime_digest:
          description: RuntimeDigest identifies the compiled bytecode that is enforced.
          type: string
        solidity_digest:
          description: SolidityDigest identifies the generated contract source.
          type: string
        solidity_source:
          description: SoliditySource is the contract generated from it.
          type: string
        source:
          description: Source is the candidate exactly as submitted.
          type: string
        status:
          description: |-
            Status is draft, active, superseded or withdrawn. Only one revision per
            organisation is active, and only an active one decides anything.
          example: active
          type: string
      type: object
    privacy-proxy_internal_apimodels.ExecutionPolicySimulateFrame:
      properties:
        call_type:
          description: CallType is call, staticcall, delegatecall or callcode.
          example: call
          type: string
        calldata:
          description: Calldata is the frame's input, 0x-prefixed hex including the
            selector.
          type: string
        code_address:
          description: |-
            CodeAddress is the account whose code runs. It differs from the storage
            address only for delegatecall and callcode, and defaults to it.
          type: string
        storage_address:
          description: StorageAddress is the account whose storage the frame may modify.
          type: string
      type: object
    privacy-proxy_internal_apimodels.ExecutionPolicySimulateRequest:
      properties:
        frames:
          description: Frames are the call frames the execution would produce, outermost
            first.
          items:
            $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ExecutionPolicySimulateFrame'
          type: array
          uniqueItems: false
        groups:
          description: Groups the hypothetical principal belongs to.
          items:
            type: string
          type: array
          uniqueItems: false
        linked_addresses:
          description: LinkedAddresses are the accounts linked to the hypothetical
            principal.
          items:
            type: string
          type: array
          uniqueItems: false
        signer:
          description: |-
            Signer is the account that would have signed the transaction. Leaving it
            empty models an execution with no recovered signer, which no rule
            requiring the signer can satisfy.
          type: string
      type: object
    privacy-proxy_internal_apimodels.ExecutionPolicySimulateResponse:
      properties:
        agreed:
          description: |-
            Agreed reports whether the reference evaluator and the compiled artifact
            reached the same decision. False would mean the reviewed policy and the
            enforced policy are not the same thing.
          type: boolean
        allowed:
          description: Allowed is the decision. Every frame must be permitted for
            it to be true.
          type: boolean
        code:
          description: Code categorises a denial and is safe to show a denied caller.
          example: argument_constraint
          type: string
        compiled_allowed:
          description: |-
            CompiledAllowed is the decision reached by running the compiled contract
            on the same inputs.
          type: boolean
        compiled_code:
          description: CompiledCode is that run's denial category.
          type: string
        reason:
          description: |-
            Reason explains a denial for an operator. It quotes policy bounds and
            addresses, so it belongs in operator tooling, not in a caller's response.
          type: string
        runtime_digest:
          description: RuntimeDigest identifies the bytecode that produced CompiledAllowed.
          type: string
      type: object
    privacy-proxy_internal_apimodels.ExecutionPolicySubmitRequest:
      properties:
        base_revision:
          description: |-
            BaseRevision is the active revision the candidate was written against.
            Zero means the organisation has no active policy yet.
