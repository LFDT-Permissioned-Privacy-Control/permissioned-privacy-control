          type: string
        id:
          type: string
        source:
          $ref: '#/components/schemas/privacy-proxy_internal_rbac.MembershipSource'
        updated_at:
          type: string
        user_id:
          type: string
        zk_credential_ref:
          type: string
      type: object
    protocol.AuthorizationRequestMessage:
      properties:
        attachments:
          items:
            $ref: '#/components/schemas/iden3comm.Attachment'
          type: array
          uniqueItems: false
        body:
          $ref: '#/components/schemas/protocol.AuthorizationRequestMessageBody'
        created_time:
          type: integer
        expires_time:
          type: integer
        from:
          type: string
        id:
          type: string
        thid:
          type: string
        to:
          type: string
        typ:
          type: string
        type:
          type: string
      type: object
    protocol.AuthorizationRequestMessageBody:
      properties:
        accept:
          items:
            type: string
          type: array
          uniqueItems: false
        callbackUrl:
          type: string
        did_doc:
          items:
            type: integer
          type: array
          uniqueItems: false
        message:
          type: string
        reason:
          type: string
        scope:
          items:
            $ref: '#/components/schemas/protocol.ZeroKnowledgeProofRequest'
          type: array
          uniqueItems: false
      type: object
    protocol.ZeroKnowledgeProofRequest:
      properties:
        circuitID:
          type: string
        extendedID:
          $ref: '#/components/schemas/math_big.Int'
        id:
          type: integer
        optional:
          type: boolean
        params:
          additionalProperties: {}
          type: object
        query:
          additionalProperties: {}
          type: object
      type: object
  securitySchemes:
    AdminToken:
      description: Admin API token (full admin, or the restricted operator token).
        Admin endpoints additionally require a private-network source address.
      in: header
      name: X-Admin-Token
      type: apiKey
    BearerAuth:
      bearerFormat: JWT
      description: 'JWT issued by the auth endpoints, sent as `Authorization: Bearer
        <token>`.'
      scheme: bearer
      type: http
    CrossOrgOracleToken:
      description: Dedicated token of the cross-org authorization oracle (CROSS_ORG_AUTHORIZATION_ORACLE_TOKEN).
        Accepted by that endpoint only, from a private-network source address; admin,
        operator and JWT credentials are not accepted there.
      in: header
      name: X-Cross-Org-Authorization-Oracle-Token
      type: apiKey
externalDocs:
  description: ""
  url: ""
info:
  contact:
    name: Gateway.fm
    url: https://gateway.fm
  description: |-
    REST control-plane and data API of the Open Privacy Suite: authentication (Privado ID wallet flow, Azure AD), ETH address linking, user profile and disclosure, RBAC / compliance / system administration, the block-explorer data API, and the proxied Ethereum JSON-RPC endpoint.

    **Authentication.** User endpoints take a Bearer JWT issued by the auth endpoints (`Authorization: Bearer <token>`). `/api/v1/admin/*` requires the `X-Admin-Token` header and is additionally reachable only from private-network addresses. `/api/v1/explorer/*` serves the explorer backend and is private-network only.

    **Aliases.** Every `/api/v1/eth/*` endpoint is also mounted at `/eth/*`; the auth endpoints are also mounted at the root (`/auth/...`, `/refresh`, `/revoke`, `/introspect`). Legacy unversioned `/api/*` mounts are deprecated and respond with an `X-Deprecated` header. Aliases are intentionally not listed as separate operations. `POST /` is the same operation as `POST /rpc`.

    **Dev-only.** A small number of operations exist only in non-production builds and say so in their descriptions.
  title: Open Privacy Suite REST API
  version: "1.0"
openapi: 3.1.0
paths:
  /api/v1/admin/access/check:
    post:
      description: 'Evaluates whether a given user (by external DID) would be allowed
        to call a method against a target in an organization, returning the resolver''s
        decision and reason. For a tier-2 org-admin JWT the probe is clamped to the
        caller''s scope: the target org must be specified and in scope, and the probed
        user must share an org with the caller — this prevents the endpoint from being
        a cluster-wide permission-map oracle. Tenant-confidential: rejected for the
        operator token (403).'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_rbac.AccessCheckRequest'
                description: access-check request
                summary: request
        description: access-check request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_rbac.AccessCheckResult'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid request body
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, target org/user
            outside the caller's scope (opaque), or operator token (tenant data not
            readable)
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Check access
      tags:
      - 'Admin: RBAC'
  /api/v1/admin/audit-logs:
    get:
      description: 'Returns RBAC audit-log entries. At least one of resource_type
        or actor_id must be supplied to avoid unbounded scans; resource_id further
        narrows a resource_type query. A super-admin sees all entries; a tier-2 org-admin
        JWT receives only entries whose resource lives in an org it administers (filtered
        in SQL, so cardinality is not an enumeration oracle). Tenant-confidential:
        rejected for the operator token (403).'
      parameters:
      - description: Filter by resource type (required unless actor_id is given)
        in: query
        name: resource_type
        schema:
          type: string
      - description: Further narrow a resource_type query to one resource
        in: query
        name: resource_id
        schema:
          type: string
      - description: Filter by actor (required unless resource_type is given)
        in: query
        name: actor_id
        schema:
          type: string
      - description: Max rows to return (default 100, max 1000)
        in: query
        name: limit
        schema:
          type: integer
      - description: Rows to skip for pagination (default 0)
        in: query
        name: offset
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/privacy-proxy_internal_apimodels.AuditLogEntryDoc'
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: at least one filter (resource_type or actor_id) is required
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, or operator token
            (tenant data not readable)
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: List RBAC audit logs
      tags:
      - 'Admin: RBAC'
  /api/v1/admin/azure-tenants:
    get:
      description: Lists the Azure AD tenants permitted to authenticate, with their
        default org/group and auto-provision settings. Super-admin token only — the
        entries reveal the cluster's SSO topology, so org admins cannot read them.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.AzureTenantListResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: super-admin token required
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: List Azure AD tenants
      tags:
      - 'Admin: shared infrastructure'
    post:
      description: Allowlists an Azure AD tenant so its users may authenticate, with
        an optional default org/group and auto-provisioning. tenant_id must be a UUID;
        a default_group_id must belong to default_org_id and must not be an org-admin
        or readonly-admin group (so SSO cannot auto-mint org admins). Super-admin
        token only — this is a cluster-wide primitive; the change is audit-logged.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.AzureTenantCreateRequest'
                description: tenant to allowlist
                summary: request
        description: tenant to allowlist
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_db.AllowedAzureTenant'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid body, tenant_id not a UUID, or default group invalid
            / admin-tier
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: super-admin token required
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: a tenant with this tenant_id already exists
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Add an Azure AD tenant
      tags:
      - 'Admin: shared infrastructure'
  /api/v1/admin/azure-tenants/{id}:
    delete:
      description: Removes an Azure AD tenant from the allowlist and, as a security
        side effect, bans every user authenticated through that tenant and revokes
        their refresh tokens. Super-admin token only; the deletion (with banned/revoked
        counts) is audit-logged.
      parameters:
      - description: Azure tenant allowlist entry ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIMessage'
          description: azure tenant deleted
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: super-admin token required
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: azure tenant not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Delete an Azure AD tenant
      tags:
      - 'Admin: shared infrastructure'
    get:
      description: Returns one Azure AD tenant allowlist entry by its ID. Super-admin
        token only.
      parameters:
      - description: Azure tenant allowlist entry ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_db.AllowedAzureTenant'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: super-admin token required
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: azure tenant not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Get an Azure AD tenant
      tags:
      - 'Admin: shared infrastructure'
    put:
      description: 'Updates an Azure AD tenant allowlist entry; omitted fields are
        left unchanged and an empty default_org_id/default_group_id clears it. Same
        validation as create: tenant_id must be a UUID, and a default group must belong
        to the default org and not be an admin-tier group. Super-admin token only;
        the change is audit-logged.'
      parameters:
      - description: Azure tenant allowlist entry ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.AzureTenantUpdateRequest'
                description: fields to update
                summary: request
        description: fields to update
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_db.AllowedAzureTenant'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid body, tenant_id not a UUID, or default group invalid
            / admin-tier
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: super-admin token required
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: azure tenant not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: a tenant with this tenant_id already exists
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Update an Azure AD tenant
      tags:
      - 'Admin: shared infrastructure'
  /api/v1/admin/cache/stats:
    get:
      description: Returns statistics for the RBAC permission cache (entry count,
        expired-pending count, capacity) — cluster-wide observability tooling. Because
        these counts expose cross-org cardinality, the endpoint is restricted to the
        super-admin (full X-Admin-Token); tier-2 org-admin JWTs and the operator token
        are rejected with 403.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_rbac.CacheStats'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, or caller is not
            a super-admin
      security:
      - AdminToken: []
      summary: Get RBAC cache stats
      tags:
      - 'Admin: RBAC'
  /api/v1/admin/compliance/currency:
    get:
      description: Returns the fleet-wide default (base) currency, the full list of
        supported fiat currencies, and whether CoinGecko price polling is enabled.
        This is the platform-wide fallback; each org can override it with its own
        per-org currency (RD-1158). Read-only; any admin token.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ComplianceBaseCurrencyResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Get the global base currency
      tags:
      - 'Admin: compliance'
    put:
      description: Switches the fleet-wide base currency and re-values the cached
        system and manual token prices from their stored multi-currency prices. Super-admin
        only — it is a platform-wide setting affecting every tenant. If manual token
        prices are missing for the target currency, the switch is refused with 409
        and the affected tokens unless force=true is set (those tokens then block
        transfers until priced). The change is written to the RBAC audit log.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ComplianceSetBaseCurrencyRequest'
                description: target currency and force flag
                summary: request
        description: target currency and force flag
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ComplianceSetBaseCurrencyResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid body or unsupported currency
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, or super-admin token
            required
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ComplianceCurrencyConflictResponse'
          description: manual token prices missing for the target currency; set force=true
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Set the global base currency
      tags:
      - 'Admin: compliance'
  /api/v1/admin/compliance/sanctions:
    get:
      description: 'Returns blocklisted addresses (global or per-org), paginated.
        Scope is enforced by caller type: super-admin sees any scope; a tier-2 org-admin
        JWT must pass an in-scope org_id (global rows are super-admin only); the operator
        token may read the global list but not a specific org''s blocklist.'
      parameters:
      - description: Restrict to one org's blocklist (required for tier-2 org-admin
          JWTs; omit for the global list)
        in: query
        name: org_id
        schema:
          type: string
      - description: Max rows to return (default 50, capped at 1000)
        in: query
        name: limit
        schema:
          type: integer
      - description: Rows to skip (default 0)
        in: query
        name: offset
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  data:
                    items: {}
                    type: array
                    uniqueItems: false
                  limit:
                    example: 50
                    type: integer
                  offset:
                    example: 0
                    type: integer
                  total:
                    example: 42
                    type: integer
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: org_id query parameter is required (tier-2 org-admin JWT)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, org out of scope,
            or a per-org read attempted with the operator token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: List sanctioned addresses
      tags:
      - 'Admin: compliance'
    post:
      description: Adds an address to the compliance blocklist. Omit org_id for a
        GLOBAL sanction (super-admin only); set it for a per-org sanction (the org
        admin's job — the operator/super-admin token cannot add per-org rows). Tier-2
        org-admin JWTs must scope to an org they fully administer. The address is
        normalized to lowercase and the action is written to the RBAC audit log.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ComplianceSanctionAddRequest'
                description: sanction fields
                summary: request
        description: sanction fields
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_compliance.SanctionedAddress'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid body, address, or reason too long
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, global requires
            super-admin, or per-org must be in scope and is not addable with the operator
            token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Add a sanctioned address
      tags:
      - 'Admin: compliance'
  /api/v1/admin/compliance/sanctions/{id}:
    delete:
      description: Removes a sanction from the blocklist by ID. Removing a global
        row requires super-admin; removing a per-org row is the org admin's job (in
        scope) and is not permitted with the operator/super-admin token. To avoid
        a cross-org existence oracle, an unknown ID and an out-of-scope row both return
        the same opaque 403. The action is written to the RBAC audit log.
      parameters:
      - description: Sanction row ID (UUID)
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIMessage'
          description: sanctioned address removed
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, row not found, out
            of scope, global requires super-admin, or per-org not removable with the
            operator token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Remove a sanctioned address
      tags:
