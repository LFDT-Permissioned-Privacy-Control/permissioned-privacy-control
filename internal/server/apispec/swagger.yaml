  /api/v1/explorer/transactions/{hash}/logs:
    get:
      description: Returns the event logs emitted by a transaction. Private network
        only (serves the explorer backend); not reachable through the public ingress.
        Logs follow each emitting contract's event access rules. A sender or recipient
        can see permitted parent-transaction logs. Where a contract enables visibleTo
        unlock, an eligible viewer listed on this transaction receives its matching
        logs with full event payloads, including embedded addresses; eligibility requires
        an in-org grant through a non-default, non-system group, or org-admin membership
        without a grant. Other contracts and transactions remain separately filtered.
      parameters:
      - description: Transaction hash (0x-prefixed)
        in: path
        name: hash
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/privacy-proxy_internal_explorer.Log'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: lookup or redaction failed
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: explorer store not configured
      summary: Event logs for a transaction
      tags:
      - Explorer
  /api/v1/explorer/transactions/{hash}/op-deposit:
    get:
      description: Returns OP Stack L1 deposit metadata for a transaction. Private
        network only (serves the explorer backend); not reachable through the public
        ingress. This deployment is not an OP Stack chain, so this always responds
        404.
      parameters:
      - description: Transaction hash (0x-prefixed)
        in: path
        name: hash
        required: true
        schema:
          type: string
      responses:
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: OP deposit not found (not an OP Stack chain)
      summary: OP Stack deposit for a transaction (not applicable)
      tags:
      - Explorer
  /api/v1/explorer/transactions/{hash}/transfers:
    get:
      description: 'Returns the token transfers emitted by a transaction. Private
        network only (serves the explorer backend); not reachable through the public
        ingress. The response is privacy-filtered for the resolved viewer: transfers
        are redacted per the viewer''s visibility.'
      parameters:
      - description: Transaction hash (0x-prefixed)
        in: path
        name: hash
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/privacy-proxy_internal_explorer.TokenTransfer'
                type: array
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: lookup or redaction failed
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: explorer store not configured
      summary: Token transfers for a transaction
      tags:
      - Explorer
  /api/v1/explorer/transactions/paginated:
    get:
      description: 'Returns a page of transactions plus a total count, using page/pageSize
        pagination. Private network only (serves the explorer backend); not reachable
        through the public ingress. The response is privacy-filtered for the resolved
        viewer: rows the viewer cannot see are dropped and surviving rows are redacted.
        A transaction may also be kept because of one of its token transfers (for
        example a transfer into a contract the viewer manages); such a row shows no
        address the viewer could not already see. Note the total is a SQL-level count
        that may slightly overcount relative to the redacted rows in data.'
      parameters:
      - description: 1-based page number
        in: query
        name: page
        schema:
          default: 1
          type: integer
      - description: Rows per page (1-100)
        in: query
        name: pageSize
        schema:
          default: 25
          type: integer
      - description: Include transaction category tags
        in: query
        name: with_categories
        schema:
          default: false
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  data:
                    items: {}
                    type: array
                    uniqueItems: false
                  total:
                    example: 25
                    type: integer
                type: object
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: lookup or redaction failed
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: explorer store not configured
      summary: List transactions (page/pageSize)
      tags:
      - Explorer
  /api/v1/explorer/transfers:
    get:
      description: 'Returns a page of token transfers across all tokens plus the count
        of returned rows. Private network only (serves the explorer backend); not
        reachable through the public ingress. The response is privacy-filtered for
        the resolved viewer: transfers are redacted per the viewer''s visibility and
        total is the count of returned rows (never the raw DB total).'
      parameters:
      - description: Max rows to return (1-100)
        in: query
        name: limit
        schema:
          default: 25
          type: integer
      - description: Rows to skip (pagination)
        in: query
        name: offset
        schema:
          default: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/data'
                properties:
                  data:
                    items: {}
                    type: array
                    uniqueItems: false
                  total:
                    example: 25
                    type: integer
                type: object
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: lookup or redaction failed
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: explorer store not configured
      summary: List all token transfers
      tags:
      - Explorer
  /api/v1/explorer/viewable-addresses:
    get:
      description: 'Lists the viewer''s own linked addresses plus addresses disclosed
        to them via active disclosure grants. The requester must remain a current
        member of the grant''s organization. Grant scope is enforced on the server,
        and successful reads are audited. Private network only (serves the explorer
        backend); not reachable through the public ingress. The response is privacy-filtered
        for the resolved viewer: the viewer DID comes from a validated JWT (or the
        impersonation override) — never from a query param — and for non-full grants
        the disclosed address is a pseudonym or "[PRIVATE]", never the real address.
        Fail-closed: with no resolvable viewer, only empty lists are returned. Under
        the View-as mirror no disclosed addresses are listed: the target''s grants
        are not available to the admin viewing as them.'
      parameters:
      - description: 'Viewer wallet address (0x-prefixed hex), echoed back for display
          only. The viewer identity is resolved solely from the JWT — a wallet value
          never resolves a DID (RD-1164 #7).'
        example: "0x0000000000000000000000000000000000000001"
        in: query
        name: wallet
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ViewableAddressesResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: neither a wallet nor JWT authentication was supplied
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: lookup failed
      summary: Addresses viewable by the resolved viewer
      tags:
      - Explorer
  /api/v1/introspect:
    post:
      description: OAuth 2.0 token introspection. Accepts a form-encoded `token` (and
        optional `token_type_hint`) and reports whether it is currently active, with
        basic metadata for active tokens. Per RFC 7662 the response is always 200
        with `active:false` for unknown, expired, or revoked tokens. Rate-limited.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
              - type: string
              - title: token
                type: string
              - title: token_type_hint
                type: string
        description: the token to introspect | \
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.IntrospectResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: token is required
      summary: Introspect a token (RFC 7662)
      tags:
      - Auth
  /api/v1/me/admin-status:
    get:
      description: Whether the authenticated user is a tier-2 org admin or a read-only
        admin, and in which organizations. A user with no DB record (or only a tier-3
        "admin" claim) gets is_admin=false.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.MyAdminStatusResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid token
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: My admin status
      tags:
      - Profile
  /api/v1/me/disclosure/grants:
    get:
      description: 'Lists disclosure grants over the authenticated user''s data that
        are currently active (approved, not expired, not revoked) — i.e. who can see
        the caller''s data right now. Scoped to the caller: a user only ever sees
        grants over their own data. Grant token hashes are never included.'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/privacy-proxy_internal_disclosure.GrantWithRequest'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid token, or no matching user
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List my active disclosure grants
      tags:
      - Disclosure (user)
  /api/v1/me/disclosure/grants/all:
    get:
      description: 'Lists every disclosure grant over the authenticated user''s data,
        in any state (active, expired, or revoked) — the full access history. Scoped
        to the caller: a user only ever sees grants over their own data. Grant token
        hashes are never included.'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/privacy-proxy_internal_disclosure.GrantWithRequest'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid token, or no matching user
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List all my disclosure grants
      tags:
      - Disclosure (user)
  /api/v1/me/disclosure/requests:
    get:
      description: 'Lists disclosure requests that are pending the authenticated user''s
        decision — i.e. requests targeting the caller''s own data. Scoped to the caller:
        a user only ever sees requests for their own data.'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/privacy-proxy_internal_disclosure.RequestWithDetails'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid token, or no matching user
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List my pending disclosure requests
      tags:
      - Disclosure (user)
  /api/v1/me/disclosure/requests/{request_id}/approve:
    post:
      description: Approves a pending disclosure request that targets the caller's
        own data, minting an access grant for the requester. A user can only approve
        requests targeting their own data (otherwise 403). The optional body may narrow
        (never widen) the granted scope and set the grant duration (defaults to 24
        hours). The response returns the new grant without its token hash.
      parameters:
      - description: Disclosure request ID
        in: path
        name: request_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ApproveDisclosureRequestBody'
                description: optional scope narrowing, grant duration, and reason
                summary: request
        description: optional scope narrowing, grant duration, and reason
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.DisclosureApproveResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: malformed body, invalid or widened scope, or request cannot
            be approved
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid token, or no matching user
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: request does not target the caller's data
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: request not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Approve a disclosure request
      tags:
      - Disclosure (user)
  /api/v1/me/disclosure/requests/{request_id}/reject:
    post:
      description: Rejects a pending disclosure request that targets the caller's
        own data; no grant is created. A user can only reject requests targeting their
        own data (otherwise 403). The request body is optional and carries only a
        free-text reason.
      parameters:
      - description: Disclosure request ID
        in: path
        name: request_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.DisclosureReasonBody'
                description: optional rejection reason
                summary: request
        description: optional rejection reason
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.DisclosureStatusResponse'
          description: 'status: rejected'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: request cannot be rejected (e.g. not pending)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid token, or no matching user
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: request does not target the caller's data
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: request not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Reject a disclosure request
      tags:
      - Disclosure (user)
  /api/v1/me/disclosure/requests/{request_id}/revoke:
    post:
      description: Revokes a disclosure request the caller previously approved, ending
        the requester's access to the caller's data. A user can only revoke requests
        targeting their own data (otherwise 403). The request body is optional and
        carries only a free-text reason.
      parameters:
      - description: Disclosure request ID
        in: path
        name: request_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.DisclosureReasonBody'
                description: optional revocation reason
                summary: request
        description: optional revocation reason
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.DisclosureStatusResponse'
          description: 'status: revoked'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: request cannot be revoked (e.g. not currently approved)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid token, or no matching user
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: request does not target the caller's data
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: request not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: Revoke a disclosure request (user)
      tags:
      - Disclosure (user)
  /api/v1/me/disclosure/requests/all:
    get:
      description: 'Lists every disclosure request targeting the authenticated user''s
        data, in any status (pending, approved, rejected, expired, revoked). Scoped
        to the caller: a user only ever sees requests for their own data.'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/privacy-proxy_internal_disclosure.RequestWithDetails'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid token, or no matching user
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: List all my disclosure requests
      tags:
      - Disclosure (user)
  /api/v1/me/orgs:
    get:
      description: The organizations the authenticated user belongs to, de-duplicated
        across group memberships.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.MyOrganizationsResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid token, or user not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - BearerAuth: []
      summary: My organizations
      tags:
      - Profile
  /api/v1/me/transactions/{hash}/execution:
    get:
      description: 'Status for a transaction submitted by this named principal, with
        current organization membership and KYC required. Shared signing addresses
        do not share status access. Queued, pending, denied and expired are nonterminal:
        an execution already started may still be included. Included or reverted reflects
        canonical node evidence; reconciled means OPS bookkeeping is committed. This
        endpoint never returns raw transactions, signing envelopes or visibility recipients.'
      parameters:
      - description: Lowercase transaction hash
        in: path
        name: hash
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.NodeTransactionProgress'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Not Found
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Service Unavailable
      security:
      - BearerAuth: []
      summary: My transaction execution status
      tags:
      - Profile
  /api/v1/refresh:
    post:
      description: Validates the refresh token, rejects it if revoked, expired, or
        the account is banned, then issues a new access token and rotates the refresh
        token (the old one is revoked). The access JWT is also refreshed in an HttpOnly
        cookie. Rate-limited.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.RefreshRequest'
                description: refresh token
                summary: request
        description: refresh token
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.AuthResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid request body
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: refresh token invalid, expired, revoked, or not found
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: account is banned
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: failed to check or issue tokens
      summary: Exchange a refresh token for new tokens
      tags:
      - Auth
  /api/v1/revoke:
    post:
      description: Revokes the supplied refresh token; if an access token is also
        supplied it is blacklisted for immediate invalidation. The access cookie is
        cleared. Revocation is best-effort against already-invalid tokens (defense
        in depth). Rate-limited.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.RevokeRequest'
                description: refresh token, and optional access token
                summary: request
        description: refresh token, and optional access token
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIMessage'
          description: token revoked successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid request body
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: failed to revoke token
      summary: Revoke a refresh token (and optionally an access token)
      tags:
      - Auth
  /health:
    get:
      description: Liveness probe. GET returns {"status":"ok"}; HEAD returns an empty
        200.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.HealthResponse'
          description: OK
      summary: Health check
      tags:
      - System
    head:
      description: Liveness probe. GET returns {"status":"ok"}; HEAD returns an empty
        200.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.HealthResponse'
          description: OK
      summary: Health check
      tags:
      - System
  /metrics:
    get:
      description: Prometheus text exposition of the proxy's metrics. Private-network
        only.
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: Prometheus text exposition format
        "403":
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network
      summary: Prometheus metrics
      tags:
      - System
  /oauth/authorize:
    get:
      description: 'Starts the OAuth authorization-code flow: validates the parameters
        and redirect_uri, creates a pending session, and generates the underlying
        Privado authorization request. Browser clients (Accept: text/html) receive
        a 302 redirect to the login page; other clients receive JSON with the session
        IDs and the authorization request to render as a QR code. An optional Bearer
        JWT may be supplied — when present, the caller''s DID is bound to the session
        as its initiator, enabling later first-party silent SSO; anonymous callers
        simply complete via the interactive flow. Only response_type=code is supported.
        Rate-limited.'
      parameters:
      - description: OAuth client ID
        in: query
        name: client_id
        required: true
        schema:
          type: string
      - description: client redirect URI (must be allowlisted)
        in: query
        name: redirect_uri
        required: true
        schema:
          type: string
      - description: opaque CSRF state echoed back to the client
        in: query
        name: state
        required: true
        schema:
          type: string
      - description: must be \
        in: query
        name: response_type
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.OAuthAuthorizeJSONResponse'
          description: 'non-browser clients: session IDs and auth request'
        "302":
          content:
            application/json:
              schema:
                type: string
          description: 'browser clients: redirect to the login page'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.OAuthErrorResponse'
          description: invalid_request or unsupported_response_type
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.OAuthErrorResponse'
          description: server misconfiguration or failure creating the session
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.OAuthErrorResponse'
          description: authentication or OAuth service at capacity
      summary: OAuth 2.0 authorization endpoint
      tags:
      - OAuth SSO
  /oauth/callback:
    post:
      description: The wallet posts the JWZ proof for an OAuth flow, naming both the
        auth session and the OAuth session via query parameters (the OAuth session
        must be linked to the given auth session). On success an authorization code
        is minted and a redirect URL (client redirect_uri with code and state) is
        returned. The body is the JWZ token, accepted as JSON (`{"token":"<jwz>"}`
        or `{"jwz_token":"<jwz>"}`) or the raw token string; it is size-capped. Rate-limited.
      parameters:
      - description: auth session ID
        in: query
        name: session
        required: true
        schema:
          type: string
      - description: OAuth session ID (must be linked to the auth session)
        in: query
        name: oauth_session
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
          text/plain:
            schema:
              title: request
              type: object
        description: JWZ token, as {\
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.OAuthCallbackResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing session parameters, unreadable body, or missing/invalid
            JWZ token
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: session not found/expired, session mismatch, or verification
            failed
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.HumanityVerificationError'
          description: ProofOfHumanity verification required, or account banned
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: failed to generate authorization code or build redirect
      summary: Submit a Privado ID proof for an OAuth session (wallet callback)
      tags:
      - OAuth SSO
  /oauth/session/{id}/info:
    get:
      description: Returns the underlying Privado authorization request for a pending
        OAuth session so the login page can render its QR code, plus whether the dev
        mock-complete path is offered. Rate-limited.
      parameters:
      - description: OAuth session ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.OAuthSessionInfoResponse'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: OAuth session or its auth session not found
      summary: Get pending OAuth session info
      tags:
      - OAuth SSO
  /oauth/session/{id}/mock-complete:
    post:
      description: Available only in non-production builds with mock login enabled.
        Instantly completes a pending OAuth session with a mock DID (optionally supplied
        in the body), bypassing Privado verification, and mints the authorization
        code. Rate-limited.
      parameters:
      - description: OAuth session ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
          text/plain:
            schema:
              title: request
              type: object
        description: optional {\
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.OAuthMockCompleteResponse'
          description: OK
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: mock login not available
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: session not found or expired
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: session already completed
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: failed to complete session
      summary: Complete an OAuth session with a mock DID (dev only)
      tags:
      - OAuth SSO
  /oauth/session/{id}/silent-complete:
    post:
      description: 'Production-safe silent SSO. Requires a valid Bearer JWT. Completes
        a pending OAuth session without the interactive wallet step only when it is
        fail-closed safe to do so: the caller''s DID must equal the session''s initiator
        DID and the session''s client must be on the first-party allowlist (an anonymous
        initiator or a non-first-party client is never eligible and falls through
        to the interactive flow). On success it mints an authorization code and returns
        the same shape as the status endpoint. Rate-limited.'
      parameters:
      - description: OAuth session ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.OAuthSessionStatusResponse'
          description: completed, with redirect_url
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: silent SSO not available for this session or client
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: session not found or expired
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: session already completed
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: failed to complete session
      security:
      - BearerAuth: []
      summary: Silently complete an OAuth session (first-party SSO)
      tags:
      - OAuth SSO
  /oauth/session/{id}/status:
    get:
      description: 'The frontend polls this during the QR scan to learn whether the
        user has completed authentication. While pending it returns `completed:false`;
        once complete it returns the client redirect URL with the authorization code
        and state. Deliberately not rate-limited: it is read-only polling during the
        login flow.'
      parameters:
      - description: OAuth session ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.OAuthSessionStatusResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: session ID required
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: session not found or expired
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid redirect URI
      summary: Poll an OAuth session for completion
      tags:
      - OAuth SSO
  /oauth/token:
    post:
      description: Exchanges an authorization code for access and refresh tokens.
        Only grant_type=authorization_code is supported; the code, client_id, and
        redirect_uri must match the session, the code must be unexpired and unused
        (single-use). First-party clients must additionally authenticate with their
        client secret, via HTTP Basic (client_secret_basic) or the client_secret body
        parameter (client_secret_post). Accepts JSON or form-encoded bodies. Rate-limited.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.OAuthTokenRequest'
                description: authorization-code grant parameters
                summary: request
          application/x-www-form-urlencoded:
            schema:
              type: string
        description: authorization-code grant parameters
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.OAuthTokenResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.OAuthErrorResponse'
          description: invalid_request, unsupported_grant_type, or invalid_grant
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.OAuthErrorResponse'
          description: invalid_client — client authentication failed
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.OAuthErrorResponse'
          description: server_error — failed to issue or persist tokens
      summary: OAuth 2.0 token endpoint
      tags:
      - OAuth SSO
  /openapi.json:
    get:
      description: The full generated OpenAPI document for this API — the same file
        the docs site renders. Regenerated from handler annotations on every merge.
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OpenAPI 3.1 document
      summary: OpenAPI specification
      tags:
      - System
  /ready:
    get:
      description: Returns 503 until the configured execution node has fresh policy
        facts matching the database. No private policy or identity data is returned.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ReadinessResponse'
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ReadinessResponse'
          description: Service Unavailable
      summary: Execution readiness
      tags:
      - Health
    head:
      description: Returns 503 until the configured execution node has fresh policy
        facts matching the database. No private policy or identity data is returned.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ReadinessResponse'
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ReadinessResponse'
          description: Service Unavailable
      summary: Execution readiness
      tags:
      - Health
  /rpc:
    post:
      description: |-
        Single Ethereum JSON-RPC 2.0 request, method-allowlisted and RBAC-checked, with per-method response redaction. Batch (array) requests are rejected.

        Member names must be exact-case and unique: a request that repeats a member name, holds two names differing only in letter case in one object (at any depth), or uses a case variant of a JSON-RPC member (e.g. `Method`) is rejected with 400 before any access decision and never reaches the node; so is an `id` that is not a string, a number or null. For methods whose params the proxy checks (all but typed-data signing and named passthrough), so are a case variant of a standard request field inside params (e.g. `To`) and an object whose `data` and `input` differ. The node receives a request rebuilt from the members the proxy read (jsonrpc, id, method, params); `visibleTo`/`privateFor` and any other top-level members are never forwarded.

        `Authorization: Bearer <token>` is OPTIONAL: anonymous callers are restricted to the anonymous method allowlist; authenticated callers get per-method RBAC and response redaction based on their identity.

        Client state/block override options on call, gas-estimation, access-list, and trace methods are unsupported for all callers, including admins. Positional null/empty-object placeholders remain allowed; debug_traceCall override and replay-position config keys must be omitted. Ordinary calls remain subject to the normal access and node validation rules.

        The transaction-sending methods (eth_sendTransaction / eth_sendRawTransaction) additionally accept a top-level `visibleTo` array (alias `privateFor`) of DIDs and/or linked ETH addresses, granting those viewers per-transaction visibility of the emitted event logs (RD-1163). It is accepted only for log-emitting contract calls.

        Ordinary upstream JSON-RPC errors retain their JSON-RPC error member. Transport, access and rate-limit failures use the non-200 statuses below. `POST /` and `POST /rpc` are the same operation.

        Client call traces and standard-profile mined traces return validated call-tree frames. The viewer's contract, function and argument permissions apply to returned calls, including delegated storage contexts. Internal-call values (a nested call's input, value, output and revert reason) are returned only to a viewer who may read the storage of the contract that produced them; otherwise they are omitted and named in the call's `redacted` array. Strict-profile mined traces return only a linked transaction participant's top frame, without internal calls or logs, subject to organization ownership checks. Trace or upstream failures return opaque non-200 errors.
      parameters:
      - description: Organization the access decision resolves against (only on /rpc/{org_id})
        in: path
        name: org_id
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.JSONRPCRequestEnvelope'
                description: JSON-RPC 2.0 request
                summary: request
        description: JSON-RPC 2.0 request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.JSONRPCResponseEnvelope'
          description: JSON-RPC response; may carry a JSON-RPC-level error member
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: unreadable body, malformed, ambiguous (duplicate or case-variant
            members) or batch JSON-RPC, invalid visibleTo, or an unsupported tracer/config
            (a tracer other than callTracer, withLog or malformed trace params)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: identity required but unresolved on a trace method (debug_traceCall
            / debug_traceTransaction)
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: runtime-trace, standard-profile trace-access (debug_traceTransaction
            for a non-participant or a missing transaction) or compliance denial
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: method not allowed for the caller (denials are masked as method
            not found), or a strict-profile mined trace unavailable to the caller
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: request body too large
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: concurrency limit, signed-approval simulation budget, or upstream
            rate limit
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: trace-validation or compliance-check error
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: failed to forward to the upstream node
      security:
      - BearerAuth: []
      summary: Proxied Ethereum JSON-RPC
      tags:
      - JSON-RPC
  /rpc/{org_id}:
