        is_system group access can only be modified by the full admin token (X-Admin-Token;
        unlike the other gates here, the operator token is rejected for is_system
        too). Reshaping an is_org_admin group''s access is rejected for a tier-2 org-admin
        JWT (an admin-tier token — full admin or operator — is required); reshaping
        a regular group''s access is rejected for the operator token (tenant management
        is the org admin''s job), which may reshape admin-tier groups (is_org_admin
        / is_org_readonly_admin) and the global default group. On is_org_admin groups
        claims must be empty and at least one method is required. The returned rpc_api_key
        is masked.'
      parameters:
      - description: Organization ID (UUID)
        in: path
        name: org_id
        required: true
        schema:
          type: string
      - description: Group ID (UUID)
        in: path
        name: group_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.GroupAccessRequest'
                description: access settings
                summary: request
        description: access settings
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_rbac.GroupAccess'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid body, unsupported method in allowed_methods, method/claim
            mismatch, or org-admin claim/method invariant violated
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, group not in the
            path org, system-group access changed by non-super-admin, tier-2 JWT reshaping
            an org-admin group, operator token reshaping a regular group, or tier-2
            JWT adding a passthrough method
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Set group access
      tags:
      - 'Admin: RBAC'
