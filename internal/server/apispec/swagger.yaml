        in: path
        name: user_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_rbac.User'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, user outside the
            caller's scope (opaque; also covers not-found), or operator token (tenant
            data not readable)
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
