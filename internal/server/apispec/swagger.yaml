    privacy-proxy_internal_apimodels.JSONRPCError:
      description: Error is set on a JSON-RPC-level failure; omitted on success.
      properties:
        code:
          example: -32601
          type: integer
        message:
          example: method not found
          type: string
      type: object
    privacy-proxy_internal_apimodels.JSONRPCRequestEnvelope:
      properties:
        id:
          description: |-
            ID is the client-chosen request id echoed back on the response. May be a
            string, a number, or null per the JSON-RPC spec.
          example: 1
          type: integer
        jsonrpc:
          description: JSONRPC is the protocol version; always "2.0".
          example: "2.0"
          type: string
        method:
          description: |-
            Method is the JSON-RPC method name (e.g. eth_blockNumber, eth_call,
            eth_sendTransaction). Anonymous callers are limited to the anonymous
            method allowlist.
          example: eth_blockNumber
          type: string
        params:
          description: Params are the positional method parameters. Shape is method-specific.
          items: {}
          type: array
          uniqueItems: false
        privateFor:
          description: PrivateFor is an accepted alias for VisibleTo (union of both
            is applied).
          items:
            type: string
          type: array
          uniqueItems: false
        visibleTo:
          description: |-
            VisibleTo is the optional RD-1163 per-transaction visibility list (DIDs
            and/or linked ETH addresses). Only meaningful for log-emitting contract
            sends. Alias: privateFor.
          example:
          - did:example:alice
          - "0x0000000000000000000000000000000000000001"
          items:
            type: string
          type: array
          uniqueItems: false
      type: object
