  /api/v1/explorer/grant/{grant_id}/{address_id}/transactions:
    get:
      description: 'Returns transactions for a disclosed address, rendered at the
        grant''s disclosure level. The requester must remain a current member of the
        grant''s organization. Grant scope is enforced on the server, and successful
        reads are audited. Private network only (serves the explorer backend); not
        reachable through the public ingress. The response is privacy-filtered for
        the grant: "full" reveals real addresses, hashes and values; "pseudonymous"
        replaces addresses with stable pseudonyms and hides values and hashes; "redacted"
        (including an empty or unknown stored level) shows only direction, gas, status
        and timing with "[PRIVATE]" counterparties. Fail-closed: a revoked or expired
        grant, or an address_id that does not belong to the grant, yields 403/404.
        Under the View-as mirror it always returns 404: the target''s grants are not
        available to the admin viewing as them.'
      parameters:
      - description: Disclosure grant ID
        in: path
        name: grant_id
        required: true
        schema:
          type: string
      - description: Opaque address identifier from viewable-addresses
        in: path
        name: address_id
        required: true
        schema:
          type: string
      - description: Max rows to return (1-100). At the scan bounds a page may come
          back short — even empty — with a next_cursor to continue from (present ⇒
          more pages)
        in: query
        name: limit
        schema:
          default: 25
          type: integer
      - description: Opaque continuation cursor from the previous response's next_cursor
          (RD-1149); takes precedence over before
        in: query
        name: cursor
        schema:
          type: string
      - description: 'Legacy: return rows strictly older than this block number (may
          skip rows of the boundary block — prefer cursor)'
        in: query
        name: before
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.GrantTransactionsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: grant_id and address_id are required, or the pagination cursor
            is malformed
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: grant is inactive or its scope does not permit this data
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: grant or address not found for this grant
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: explorer store not configured or lookup failed
      summary: Grant-scoped transactions for a disclosed address
      tags:
      - Explorer
  /api/v1/explorer/grant/{grant_id}/{address_id}/transactions/{tx_hash}:
    get:
      description: Returns a transaction involving the disclosed address within an
        active Full grant's consented date and address scope. The authenticated requester
        must remain a member of the grant's organization. Pseudonymous and redacted
        grants, a transaction outside scope, and View-as return 404. Transactions
        require transaction_history or full_disclosure permission. The access is audited.
        Private network only; not reachable through public ingress.
      parameters:
      - description: Disclosure grant ID
        in: path
        name: grant_id
        required: true
        schema:
          type: string
      - description: Opaque address identifier from viewable-addresses
        in: path
        name: address_id
        required: true
        schema:
          type: string
      - description: Transaction hash (0x-prefixed, 32 bytes)
        in: path
        name: tx_hash
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.GrantTransactionDetail'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid transaction hash
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: inactive grant or transaction history not permitted
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: grant or transaction not available
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: lookup failed
      security:
      - BearerAuth: []
      summary: Grant-scoped transaction detail
      tags:
      - Explorer
  /api/v1/explorer/grant/{grant_id}/activity:
    get:
      description: 'Returns activity-log entries (method, status code, timestamp only)
        for a disclosure grant the caller holds. The requester must remain a current
        member of the grant''s organization. Grant scope is enforced on the server,
        and successful reads are audited. Private network only (serves the explorer
        backend); not reachable through the public ingress. The response is privacy-filtered:
        a valid JWT is required, the viewer DID must match the grant''s requester,
        the grant scope must include activity_logs or full_disclosure, and only entries
        inside the grant''s validity window are returned. Fail-closed: anonymous callers
        are rejected, and "grant missing"/"not your grant"/"expired" all return the
        same 404 to prevent enumeration. Under the View-as mirror it always returns
        404: the target''s grants are not available to the admin viewing as them.'
      parameters:
      - description: Disclosure grant ID
        in: path
        name: grant_id
        required: true
        schema:
          type: string
      - description: Max rows to return (1-100)
        in: query
        name: limit
        schema:
          default: 25
          type: integer
      - description: Rows to skip (pagination)
        in: query
        name: offset
        schema:
          default: 0
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.GrantActivityLogsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: grant_id is required
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: grant scope does not permit activity logs or restricts addresses
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: grant not found (also returned for a grant that is not yours
            or has expired)
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: lookup failed
      summary: Grant-scoped activity logs
      tags:
      - Explorer
  /api/v1/explorer/grant/{grant_id}/resolve/{address_id}:
    get:
      description: 'Resolves an opaque address_id (issued by viewable-addresses) back
        to grant-scoped disclosure data for the explorer backend. The requester must
        remain a current member of the grant''s organization. Grant scope is enforced
        on the server, and successful reads are audited. Private network only (serves
        the explorer backend); not reachable through the public ingress. The response
        is scoped to the grant''s disclosure level: the real address is returned ONLY
        for a "full" grant; a "pseudonymous" grant returns a stable pseudonym and
        no real address; other levels return neither. Fail-closed: a revoked or expired
        grant, or an address_id that does not belong to the grant, yields 403/404.
        Under the View-as mirror it always returns 404: the target''s grants are not
        available to the admin viewing as them.'
      parameters:
      - description: Disclosure grant ID
        in: path
        name: grant_id
        required: true
        schema:
          type: string
      - description: Opaque address identifier from viewable-addresses
        in: path
        name: address_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ResolveAddressResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: grant_id and address_id are required
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: authentication required
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: grant is inactive or its scope does not permit this data
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: grant or address not found for this grant
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: lookup failed
      summary: Resolve a grant-scoped address_id
      tags:
      - Explorer
