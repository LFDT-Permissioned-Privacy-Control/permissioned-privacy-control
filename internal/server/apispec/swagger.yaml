      - AddressSourcePrincipalLinked
      - AddressSourceLiteral
    privacy-proxy_internal_policydsl.ArgConstraint:
      properties:
        addressEquals:
          $ref: '#/components/schemas/privacy-proxy_internal_policydsl.AddressMatch'
        index:
          description: |-
            Index is the zero-based position of the argument in the function's inputs.

            A document must state it explicitly. Because zero is a meaningful position,
            an omitted index would quietly constrain the first argument and leave the
            one the author meant unbounded.
          type: integer
        recordParty:
          $ref: '#/components/schemas/privacy-proxy_internal_policydsl.RecordPartyMatch'
        uintAtMost:
          description: |-
            UintAtMost is an inclusive upper bound for an unsigned integer argument,
            written in decimal so that large token amounts survive JSON round-trips.
          type: string
      type: object
    privacy-proxy_internal_policydsl.Artifact:
      properties:
        compiler:
          $ref: '#/components/schemas/privacy-proxy_internal_policydsl.CompilerSettings'
        creation_bytecode:
          description: |-
            CreationBytecode is the constructor output, kept for the case where the
            artifact is ever deployed rather than executed directly.
          items:
            type: integer
          type: array
