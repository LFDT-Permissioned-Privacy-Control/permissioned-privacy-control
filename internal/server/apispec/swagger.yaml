  /api/v1/admin/logs:
    get:
      description: Filtered, paginated access-log rows. Results are scoped to the
        caller's organization(s) for a tier-2 admin JWT; the super-admin token sees
        fleet-wide rows. status_code and outcome are mutually exclusive. total is
        -1 when the count query fails.
      parameters:
      - description: Filter by caller external ID (DID)
        in: query
        name: external_id
        schema:
          type: string
      - description: Filter by JSON-RPC method
        in: query
        name: method
        schema:
          type: string
      - description: Filter by correlation ID
        in: query
        name: correlation_id
        schema:
          type: string
      - description: Exact HTTP status code (mutually exclusive with outcome)
        in: query
        name: status_code
        schema:
          type: integer
      - description: Status class filter
        in: query
        name: outcome
        schema:
          enum:
          - success
          - denied
          - error
          - all
          type: string
      - description: Start of time range (RFC3339)
        in: query
        name: from
        schema:
          type: string
      - description: End of time range (RFC3339)
        in: query
        name: to
        schema:
          type: string
      - description: Max rows (default 100, capped server-side)
        in: query
        name: limit
        schema:
          type: integer
      - description: Row offset for pagination (default 0)
        in: query
        name: offset
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.AdminLogsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid filter (e.g. status_code+outcome together, bad timestamp)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: List access logs
      tags:
      - 'Admin: ops'
