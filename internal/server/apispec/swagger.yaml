        policy_digest:
          description: |-
            PolicyDigest is the lowercase hex sha256 of the canonical policy document
            this was generated from, binding the artifact to its source of truth.
          type: string
        runtime_bytecode:
          description: RuntimeBytecode is the deployed code, which is what an evaluator
            executes.
          items:
            type: integer
          type: array
          uniqueItems: false
        runtime_digest:
          description: RuntimeDigest is the lowercase hex sha256 of RuntimeBytecode.
          type: string
        source:
          description: Source is the generated Solidity.
          type: string
        source_digest:
          description: SourceDigest is the lowercase hex sha256 of Source.
          type: string
      type: object
    privacy-proxy_internal_policydsl.Binding:
