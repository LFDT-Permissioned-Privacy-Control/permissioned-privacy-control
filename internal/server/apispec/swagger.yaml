        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: failed to persist user record or issue tokens
      summary: Submit a Privado ID proof manually (dev only)
      tags:
      - Auth
