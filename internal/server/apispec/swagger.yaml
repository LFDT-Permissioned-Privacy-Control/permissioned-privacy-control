      tags:
      - 'Admin: RBAC'
    post:
      description: 'Adds an existing user to a group. Body: group_id (required) and
        expires_at (optional RFC3339, must be in the future — a time-boxed access
        window; omit for permanent). Requires full (is_org_admin) scope over the target
        group''s org; the check runs before the body is read so the response is not
        a user-enumeration oracle. Adding a member to an is_org_admin group is rejected
        for a tier-2 org-admin JWT (an admin-tier token — full admin or operator —
        is required); adding to a regular group is rejected for the operator token
        (tenant management is the org admin''s job). To onboard a not-yet-provisioned
        DID, use the by-did endpoint instead.'
      parameters:
      - description: User ID (UUID)
        in: path
        name: user_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.MembershipCreateRequest'
                description: membership to create
                summary: request
        description: membership to create
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_rbac.UserMembership'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid body or expires_at (must be RFC3339 and in the future)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, target group outside
            the caller's full-admin scope (opaque), tier-2 JWT adding to an org-admin
            group, or operator token adding to a regular group
