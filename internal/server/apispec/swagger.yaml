      properties:
        error:
          $ref: '#/components/schemas/privacy-proxy_internal_apimodels.JSONRPCError'
        id:
          description: ID echoes the request id.
          example: 1
          type: integer
        jsonrpc:
          description: JSONRPC is the protocol version; always "2.0".
          example: "2.0"
          type: string
        result:
          description: |-
            Result is the method result on success. Shape is method-specific;
