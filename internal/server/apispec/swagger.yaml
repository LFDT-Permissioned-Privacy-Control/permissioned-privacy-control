  /api/v1/auth/callback:
    post:
      description: 'Step 2 of the Privado ID wallet login. The wallet posts the JWZ
        proof to the session named by the `session` query parameter (the callback
        URL from step 1). On success the proof is verified and access + refresh tokens
        are issued. The body is the JWZ token, accepted either as JSON (`{"token":"<jwz>"}`
        or `{"jwz_token":"<jwz>"}`) or as the raw token string; it is size-capped.
        If the wallet''s DID is anchored on an iden3 network this deployment has no
        state resolver for, the response is a 401 carrying `error: network_not_supported`
        and the network name, distinguishing a missing deployment setting from a bad
        proof; every other verification failure stays opaque. Rate-limited.'
      parameters:
      - description: auth session ID from /auth/request
        in: query
        name: session
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
          text/plain:
            schema:
              title: request
              type: object
        description: JWZ token, as {\
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.AuthResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing session parameter, unreadable body, or missing JWZ
            token
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.UnsupportedNetworkError'
          description: 'session not found/expired; JWZ verification failed (opaque);
            or the wallet''s iden3 network is not configured here (error: network_not_supported)'
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.HumanityVerificationError'
          description: ProofOfHumanity verification required, or account banned
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: failed to persist user record or issue tokens
      summary: Submit a Privado ID proof (wallet callback)
      tags:
      - Auth
  /api/v1/auth/providers:
    get:
      description: Returns the identifiers of the authentication providers this deployment
        has configured (always includes "privado"; adds "azuread" when Azure AD is
        enabled), plus the iden3 identity networks it has a state resolver for (e.g.
        "privado:main", "billions:main"), so the login UI can render the right options
        and avoid advertising a wallet network this deployment cannot verify. Deployment
        capability only -- no tenant or user data. Public.
