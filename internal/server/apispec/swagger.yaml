  /api/v1/admin/orgs/{org_id}/contracts:
    get:
      description: Lists the contracts registered to the organization, most recent
        first, with an optional case-insensitive search over name/address and a created-at
        date window. Scoped to {org_id}; a tier-2 admin only sees their own org's
        contracts.
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          type: string
      - description: Max rows to return (default 50)
        in: query
        name: limit
        schema:
          type: integer
      - description: Rows to skip for pagination (default 0)
        in: query
        name: offset
        schema:
          type: integer
      - description: Case-insensitive filter over contract name or address
        in: query
        name: search
        schema:
          type: string
      - description: Only contracts created on or after this ISO 8601 date
        in: query
        name: created_after
        schema:
          type: string
      - description: Only contracts created before this ISO 8601 date
        in: query
        name: created_before
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.ContractListResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: operator token cannot read tenant data, or caller is out of
            org scope
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: List contracts
      tags:
      - 'Admin: RBAC'
