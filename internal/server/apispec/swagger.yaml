      - description: Grant access token (alternative to the X-Disclosure-Token header)
        in: query
        name: token
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_disclosure.ActivitySummary'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token, or invalid/absent disclosure
            token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, or token does not
            match the grant
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: grant unavailable to the current requester or organization
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Get activity summary for a grant
      tags:
      - 'Admin: disclosure'
  /api/v1/admin/disclosure/requests:
    get:
      description: 'Lists disclosure requests, filtered and clamped to the caller''s
        org scope: the org_id filter must be within the caller''s admin scope, so
        a caller only ever sees requests for orgs they administer. When org_id is
        omitted it falls back to the caller''s single admin org (super-admin/dev defaults
        to the system org); a multi-org JWT admin must supply org_id. Additional filters
        narrow the result set.'
      parameters:
      - description: Organization to list requests for; required for multi-org JWT
          admins
        in: query
        name: org_id
        schema:
          type: string
      - description: Filter by request status
        in: query
        name: status
        schema:
          enum:
          - pending
          - approved
          - rejected
          - expired
          - revoked
          type: string
      - description: Filter by the user whose data is targeted
        in: query
        name: target_user_id
        schema:
          type: string
      - description: Filter by the requester DID
        in: query
        name: requester_did
        schema:
          type: string
      - description: Filter by disclosure level
        in: query
        name: disclosure_level
        schema:
          enum:
          - full
          - pseudonymous
          - redacted
          type: string
      - description: Only requests created on or after this RFC3339 timestamp
        in: query
        name: date_from
        schema:
          type: string
      - description: Only requests created on or before this RFC3339 timestamp
        in: query
        name: date_to
        schema:
          type: string
      - description: Maximum number of results
        in: query
        name: limit
        schema:
          type: integer
      - description: Number of results to skip
        in: query
        name: offset
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_disclosure.DisclosureListResult'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: org_id required (ambiguous multi-org caller)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, or org_id outside
            the caller's scope
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: List disclosure requests
      tags:
      - 'Admin: disclosure'
    post:
      description: 'Creates a disclosure request on behalf of an authorized viewer
        (e.g. a regulator) targeting one user''s activity. Scoped to the caller''s
        admin authority: org_id must be an org the caller fully administers and target_user_id
        must share an org with the caller — a request cannot be manufactured for another
        org''s user. org_id may be omitted only when it is unambiguous (single-org
        JWT admin, or super-admin/dev which defaults to the system org); a multi-org
        JWT admin must supply it. The created request is pending until the target
        user approves or rejects it.'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.CreateDisclosureRequestBody'
                description: disclosure request (target_user_id and reason required)
                summary: request
        description: disclosure request (target_user_id and reason required)
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_disclosure.Request'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: invalid body or scope, or org_id required (ambiguous multi-org
            caller)
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, or org_id / target_user_id
            outside the caller's scope
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Create a disclosure request
      tags:
      - 'Admin: disclosure'
  /api/v1/admin/disclosure/requests/{request_id}:
    delete:
      description: Deletes a disclosure request that is still pending. Only requests
        in an org the caller fully administers can be deleted; a request outside the
        caller's scope, or one that does not exist, returns a generic 403 (no existence
        oracle). Only pending requests are deletable — an already-decided request
        returns 400.
      parameters:
      - description: Disclosure request ID
        in: path
        name: request_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.DisclosureStatusResponse'
          description: 'status: deleted'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: request is not pending
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, or request not found
            / outside the caller's scope
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Delete a pending disclosure request
      tags:
      - 'Admin: disclosure'
    get:
      description: Returns a single disclosure request with related details (requester/target
        DIDs, any active grant ID). Readable only when the request's org is within
        the caller's admin scope; a request outside the caller's scope, or one that
        does not exist, returns a generic 403 (no existence oracle).
      parameters:
      - description: Disclosure request ID
        in: path
        name: request_id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_disclosure.RequestWithDetails'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, or request not found
            / outside the caller's scope
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Get a disclosure request
      tags:
      - 'Admin: disclosure'
  /api/v1/admin/eth-addresses/collisions:
    get:
      description: Returns ETH addresses linked to more than one DID — potential key-sharing
        or key-compromise events to review. A super-admin (full X-Admin-Token) receives
