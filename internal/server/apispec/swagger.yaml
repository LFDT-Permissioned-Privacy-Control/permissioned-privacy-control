  /api/v1/admin/disclosure/grants/{grant_id}/revoke:
    post:
      description: Revokes an active disclosure grant, immediately ending the authorized
        viewer's access. Only grants whose owning org the caller fully administers
        can be revoked; a grant outside the caller's scope, or one that does not exist,
        returns a generic 403 (no existence oracle). The request body is optional
        and carries only a free-text revocation reason.
      parameters:
      - description: Disclosure grant ID
        in: path
        name: grant_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/privacy-proxy_internal_apimodels.DisclosureReasonBody'
                description: optional revocation reason
                summary: request
        description: optional revocation reason
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.DisclosureStatusResponse'
          description: 'status: revoked'
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: missing or invalid admin token
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: source address not on the private network, or grant not found
            / outside the caller's scope
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/privacy-proxy_internal_apimodels.APIError'
          description: Internal Server Error
      security:
      - AdminToken: []
      summary: Revoke a disclosure grant (admin)
      tags:
      - 'Admin: disclosure'
  /api/v1/admin/disclosure/grants/{grant_id}/summary:
