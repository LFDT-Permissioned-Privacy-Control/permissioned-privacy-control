# E2E-only image provenance and fixture overlay for docker-compose.privacy.yml.
#
# The production manifest remains untouched and is still the topology oracle.
# This overlay changes how the five first-party images are obtained: the current
# proxy tree is built locally; explorer and indexer repositories are built from
# harness-managed, pinned checkouts. It also supplies the test-only audit-DB
# bootstrap and DSNs needed to start the current binary. This fixture records a
# measured production-manifest gap; it is not a product fix. Clearing `image`
# makes Compose assign project-scoped image names, keeping tags isolated between
# concurrent runs. `down --rmi local` removes only images owned by this run.

services:
  privacy-postgres:
    environment:
      - AUDIT_APP_PASSWORD=${AUDIT_APP_PASSWORD:?AUDIT_APP_PASSWORD is required by the privacy E2E fixture}
    volumes:
      - ./scripts/init-audit-db.sh:/docker-entrypoint-initdb.d/10-init-audit-db.sh:ro

  chain-indexer:
    image: !reset null
    build:
      context: ${E2E_CHAIN_INDEXER_PATH:?E2E_CHAIN_INDEXER_PATH is required}
      dockerfile: Dockerfile

  proxy-backend:
    image: !reset null
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: prod
      args:
        VERSION: ${E2E_BUILD_VERSION:-e2e}
        GIT_COMMIT: ${E2E_BUILD_GIT_COMMIT:-unknown}
        BUILD_TIME: ${E2E_BUILD_TIME:-unknown}
    environment:
      - AUDIT_ADMIN_DATABASE_URL=postgres://postgres:${PRIVACY_POSTGRES_PASSWORD:?PRIVACY_POSTGRES_PASSWORD is required in privacy mode}@privacy-postgres:5432/privacy_proxy_audit?sslmode=disable
      - AUDIT_DATABASE_URL=postgres://privacy_proxy_app:${AUDIT_APP_PASSWORD:?AUDIT_APP_PASSWORD is required by the privacy E2E fixture}@privacy-postgres:5432/privacy_proxy_audit?sslmode=disable

  proxy-frontend:
    image: !reset null
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod

  block-explorer-api:
    image: !reset null
    build:
      context: ${E2E_BLOCK_EXPLORER_PATH:?E2E_BLOCK_EXPLORER_PATH is required}/backend
      dockerfile: Dockerfile.api
      target: privacy
      args:
        VERSION: ${E2E_BLOCK_EXPLORER_VERSION:-e2e}
        GIT_COMMIT: ${E2E_BLOCK_EXPLORER_GIT_COMMIT:-unknown}
        BUILD_TIME: ${E2E_BUILD_TIME:-unknown}

  block-explorer-frontend:
    image: !reset null
    build:
      context: ${E2E_BLOCK_EXPLORER_PATH:?E2E_BLOCK_EXPLORER_PATH is required}/frontend
      dockerfile: Dockerfile
