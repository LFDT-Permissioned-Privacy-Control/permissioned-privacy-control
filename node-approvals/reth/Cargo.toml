[package]
name = "ops-reth-approvals"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
reth-metrics = { path = "../../.tmp/reth/crates/metrics" }
reth-ethereum = { path = "../../.tmp/reth/crates/ethereum/reth", features = ["node", "cli", "evm"] }
reth-basic-payload-builder = { path = "../../.tmp/reth/crates/payload/basic" }
reth-chain-state = { path = "../../.tmp/reth/crates/chain-state" }
reth-ethereum-payload-builder = { path = "../../.tmp/reth/crates/ethereum/payload" }
reth-payload-builder-primitives = { path = "../../.tmp/reth/crates/payload/builder-primitives" }
reth-ethereum-engine-primitives = { path = "../../.tmp/reth/crates/ethereum/engine-primitives" }
alloy-evm = "=0.38.0"
alloy-primitives = "=1.6.1"
alloy-rpc-types-trace = "=2.3.0"
revm-inspectors = "=0.42.0"
ed25519-dalek = "=2.2.0"
tokio = { version = "=1.52.3", features = ["full"] }
tokio-stream = { version = "=0.1.18", features = ["net"] }
tonic = { version = "=0.14.5", default-features = false, features = ["transport", "codegen"] }
tonic-prost = "=0.14.5"
prost = "=0.14.3"
getrandom = "=0.3.4"
ipnet = "=2.12.0"
eyre = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[build-dependencies]
tonic-prost-build = { version = "=0.14.5", default-features = false, features = ["transport"] }

[dev-dependencies]
h2 = "=0.4.16"
http = "=1.4.2"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
debug = 0
lto = false
codegen-units = 16
