[package]
name = "ops-reth-policy"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
reth-sdk = ["dep:reth-ethereum", "dep:revm-inspectors", "dep:alloy-rpc-types-trace", "dep:tower"]

[[bin]]
name = "ops-reth"
path = "src/main.rs"
required-features = ["reth-sdk"]

[dependencies]
alloy-consensus = "=2.3.0"
alloy-eips = "=2.3.0"
alloy-evm = "=0.38.0"
alloy-primitives = { version = "=1.6.1", features = ["serde"] }
alloy-sol-types = "=1.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "=0.22.1"
ed25519-dalek = "=2.2.0"
sha2 = "=0.10.9"
async-trait = "=0.1.92"
bytes = "=1.12.1"
eyre = "=0.6.12"
http = "=1.4.2"
http-body-util = "=0.1.3"
hyper = { version = "=1.10.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
subtle = "=2.6.1"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
reth-ethereum = { path = "../../.tmp/reth/crates/ethereum/reth", features = ["node", "cli", "evm"], optional = true }
revm-inspectors = { version = "=0.42.0", optional = true }
alloy-rpc-types-trace = { version = "=2.3.0", optional = true }
tower = { version = "=0.5.3", optional = true }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
