// Delivery benchmark receiver. gRPC at the version Besu 26.8.1 ships (grpc-* 1.79.0 on Netty
// 4.2.17), because that is what a plugin inside Besu would have to use; protobuf/stub/protobuf-java
// are the parts Besu does not ship and a plugin would bundle.
plugins {
  id 'java'
  id 'application'
  id 'com.google.protobuf' version '0.9.5'
}
repositories { mavenCentral() }
def grpcVersion = '1.79.0'
dependencies {
  // gRPC's default 4.1 dependency line does not match the Besu runtime and
  // contains advisory-affected codecs. Keep the benchmark on the same BOM.
  implementation enforcedPlatform('io.netty:netty-bom:4.2.17.Final')
  implementation "io.grpc:grpc-netty:${grpcVersion}"
  implementation "io.grpc:grpc-protobuf:${grpcVersion}"
  implementation "io.grpc:grpc-stub:${grpcVersion}"
  // Match the protoc that generates the code: generated sources reference @com.google.protobuf.Generated (4.32+).
  implementation 'com.google.protobuf:protobuf-java:4.32.1'
  implementation 'io.netty:netty-tcnative-boringssl-static:2.0.72.Final'
  compileOnly 'org.apache.tomcat:annotations-api:6.0.53'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
protobuf {
  protoc { artifact = 'com.google.protobuf:protoc:4.32.1' }
  plugins { grpc { artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}" } }
  generateProtoTasks { all()*.plugins { grpc {} } }
}
sourceSets.main.proto.srcDir '../proto'
application { mainClass = 'ops.approvals.bench.BenchReceiver' }
