# Tern configuration for Open Privacy Suite
# Usage: tern migrate -c tern.conf

[database]
# Connection string from environment variable
# Set DATABASE_URL or use: postgres://user:pass@localhost:5432/dbname
host = {{ env "PGHOST" }}
port = {{ env "PGPORT" }}
database = {{ env "PGDATABASE" }}
user = {{ env "PGUSER" }}
password = {{ env "PGPASSWORD" }}

# Alternative: use connection string
# conn_string = {{ env "DATABASE_URL" }}

[data]
# Variables available in migration templates
# Access via {{ .VariableName }} in SQL files

[options]
# Table to track schema version
version_table = schema_version
